name: Ошибка
description: Сообщить о воспроизводимом дефекте Оформлятора
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте реальные документы, коды доступа, персональные данные, SMTP-реквизиты или резервные копии.
  - type: input
    id: version
    attributes:
      label: Версия и commit
      description: Укажите версию из интерфейса/RELEASE_IDENTITY и commit, если известен.
      placeholder: "0.6.5 / candidate / pilot / abcdef..."
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Среда
      options:
        - GitHub generic bundle
        - Debian target
        - Astra Linux target
        - Запуск из исходников
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Минимальная последовательность действий без чувствительных данных.
      placeholder: |
        1. Открыть ...
        2. Выбрать ...
        3. Получить ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
      description: Укажите текст ошибки и correlation ID, если он показан. Секреты удалите.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Дополнительные сведения
      description: Обезличенные логи, скриншоты, тип DOCX/XLSX, условия restart/update/rollback.
