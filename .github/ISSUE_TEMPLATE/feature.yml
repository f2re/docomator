name: Улучшение
description: Предложить пользовательскую возможность или улучшение workflow
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую пользовательскую проблему нужно решить
      description: Опишите задачу пользователя, а не выбранную технологию.
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: Желаемый сценарий
      placeholder: "файл → preview → исправление → результат"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерий готовности
      description: Что пользователь должен суметь сделать без знания внутреннего устройства системы.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Ограничения проекта
      options:
        - label: Сценарий должен работать без обязательного Internet.
          required: true
        - label: LLM не должен становиться обязательным для детерминированной операции.
          required: true
        - label: Изоляция пространств не должна ослабляться.
          required: true
