name: Завершить редактор строки, пробную проверку и большие группы

on:
  push:
    branches:
      - fix/template-row-trial-groups-ux-final
    paths:
      - .github/workflows/finalize-template-row-trial-groups-ux.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-template-row-final
      DOCOMATOR_PORT: 18080
      DOCOMATOR_E2E_BASE_URL: http://127.0.0.1:18080
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Получить финальную ветку
        uses: actions/checkout@v4
        with:
          ref: fix/template-row-trial-groups-ux-final
          fetch-depth: 0
          show-progress: false

      - name: Восстановить незавершённую реализацию при необходимости
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .ci-template-row-final.log .ci-template-row-final-api.log
          if [[ ! -f apps/api/ui/group-management-v2.js || ! -f packages/storage/src/template-draft-field-editor.ts ]]; then
            git fetch origin fix/template-row-trial-groups-ux:refs/remotes/origin/fix/template-row-trial-groups-ux
            git checkout origin/fix/template-row-trial-groups-ux -- \
              scripts/ci/apply-template-row-ux-server.py \
              scripts/ci/apply-template-row-ux-client.py \
              scripts/ci/apply-template-row-ux-tests.py \
              scripts/ci/fix-template-row-ux-known-issues.py
            python3 scripts/ci/apply-template-row-ux-server.py
            python3 scripts/ci/apply-template-row-ux-client.py
            python3 scripts/ci/apply-template-row-ux-tests.py
            python3 scripts/ci/fix-template-row-ux-known-issues.py
          fi
          test -f packages/storage/src/template-draft-field-editor.ts
          test -f apps/api/src/template-draft-field-edit-routes.ts
          test -f apps/api/ui/template-placement-guidance.js
          test -f apps/api/ui/template-multi-trial-recovery.js
          test -f apps/api/ui/group-management-v2.js
          test -f tests/e2e/group-management-large.spec.mjs
          git diff --check

      - name: Определить версию Node.js
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Полная проверка репозитория
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee .ci-template-row-final.log

      - name: Миграции на чистой базе
        shell: bash
        run: |
          set -o pipefail
          npm run migrate 2>&1 | tee -a .ci-template-row-final.log

      - name: Установить Chromium
        run: npx playwright install --with-deps chromium

      - name: Полный Chromium-набор
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run start:api > .ci-template-row-final-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:18080/readyz > /dev/null; then
              set -o pipefail
              npm run test:e2e 2>&1 | tee -a .ci-template-row-final.log
              exit 0
            fi
            sleep 1
          done
          cat .ci-template-row-final-api.log | tee -a .ci-template-row-final.log
          exit 1

      - name: Сохранить диагностику при ошибке
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo
            echo '--- API LOG ---'
            cat .ci-template-row-final-api.log 2>/dev/null || true
          } >> .ci-template-row-final.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-template-row-final.log
          git commit --no-verify -m 'capture final template row UX diagnostics' || true
          git push origin HEAD:fix/template-row-trial-groups-ux-final || true

      - name: Очистить временные файлы
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-template-row-ux-server.py \
            scripts/ci/apply-template-row-ux-client.py \
            scripts/ci/apply-template-row-ux-tests.py \
            scripts/ci/fix-template-row-ux-known-issues.py \
            .github/workflows/finalize-template-row-trial-groups-ux.yml \
            .ci-template-row-final.log \
            .ci-template-row-final-api.log
          git diff --check

      - name: Синхронизировать с текущим main и зафиксировать
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'fix template row editing trial recovery and large groups'
          fi
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:fix/template-row-trial-groups-ux-final

      - name: Повторно проверить актуальность после rebase
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check
          rm -rf "$DOCOMATOR_DATA_DIR"
          npm run migrate

      - name: Слить итог в main либо удалить пустую ветку
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          if git diff --quiet origin/main...HEAD; then
            echo 'Требуемое дерево уже находится в main.'
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/fix/template-row-trial-groups-ux-final" || true
            exit 0
          fi
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head fix/template-row-trial-groups-ux-final \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')
          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head fix/template-row-trial-groups-ux-final \
              --base main \
              --title 'Исправить повторное редактирование строки, пробную проверку и большие группы' \
              --body 'Завершены PUT/DELETE-маршруты полей шаблона, повторное редактирование строки Word, понятное объяснение пустых мест, восстановление общей пробной проверки и постраничное управление группами до 1000 участников. Выполнены npm run check, миграции, полный Chromium-набор и повторная проверка после rebase на актуальный main.'
            pr_number=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head fix/template-row-trial-groups-ux-final \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')
          fi
          test -n "$pr_number"
          test "$pr_number" != "null"
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --admin \
            --delete-branch \
            --subject 'Исправить повторное редактирование строки, пробную проверку и большие группы' \
            --body 'Добавлены полноценное изменение и удаление связей полей шаблона, устойчивый мастер строки Word, понятные подсказки пустого места, восстановление общей проверки при изменении состава полей и постраничное управление большими группами. Полный check, миграции и Chromium прошли.'
