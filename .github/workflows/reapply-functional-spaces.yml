name: Завершить функциональные пространства

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - feature/functional-spaces
    paths:
      - .apply-functional-spaces-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: feature/functional-spaces
          fetch-depth: 0
          show-progress: false

      - name: Применить исправления
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/fix-functional-spaces-regressions.py
          rm -f \
            scripts/ci/fix-functional-spaces-regressions.py \
            .fix-functional-spaces-e2e \
            .apply-functional-spaces-v2 \
            .github/workflows/fix-functional-spaces-e2e.yml \
            .github/workflows/reapply-functional-spaces.yml
          git diff --check

      - name: Определить версию Node.js
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Проверить код и чистую миграцию
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-functional-spaces-check
        run: |
          npm run check
          npm run migrate

      - name: Установить Chromium
        run: npx playwright install --with-deps chromium

      - name: Выполнить полный Chromium-набор
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-functional-spaces-browser
          DOCOMATOR_PORT: 18080
          DOCOMATOR_E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          set -Eeuo pipefail
          npm run migrate
          npm run start:api > "$RUNNER_TEMP/docomator-functional-spaces-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/readyz > /dev/null; then
              npm run test:e2e
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/docomator-functional-spaces-api.log"
          exit 1

      - name: Зафиксировать проверенные изменения
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix functional spaces regressions'
          git push origin HEAD:feature/functional-spaces
