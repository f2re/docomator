name: Apply interface art-direction remediation

on:
  push:
    branches:
      - agent/interface-art-direction
    paths:
      - .github/workflows/apply-interface-art-direction-remediation.yml

permissions:
  contents: write

concurrency:
  group: apply-interface-art-direction-remediation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/interface-art-direction
          fetch-depth: 0

      - name: Apply exact audited corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(relative, old, new, expected=1):
              path = Path(relative)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{relative}: ожидалось вхождений {expected}, найдено {count}: {old[:100]!r}"
                  )
              path.write_text(source.replace(old, new), encoding="utf-8")

          replace_exact(
              "apps/api/ui/help-center.css",
              "  outline: none;\n",
              "",
          )
          replace_exact(
              "apps/api/ui/help-project-documents.css",
              "  outline: none;\n",
              "",
              expected=2,
          )
          replace_exact(
              "apps/api/ui/styles.css",
              ".search-field input { width: 100%; color: var(--text); background: transparent; border: 0; outline: 0; }",
              ".search-field input { width: 100%; color: var(--text); background: transparent; border: 0; }",
          )

          test_path = Path("tests/e2e/art-direction.spec.mjs")
          test_source = test_path.read_text(encoding="utf-8")
          old_test = '''test("видимый фокус сохраняется на основной навигации", async ({ page }) => {
            await openMockedWorkspace(page);
            const employees = page.locator('.nav-item[data-view-target="employees"]');
            await employees.focus();
            const outline = await employees.evaluate((element) => {
              const style = getComputedStyle(element);
              return {
                style: style.outlineStyle,
                width: parseFloat(style.outlineWidth)
              };
            });
            expect(outline.style).not.toBe("none");
            expect(outline.width).toBeGreaterThanOrEqual(2);
          });'''
          new_test = '''test("видимый фокус сохраняется на основной навигации", async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await openMockedWorkspace(page);
            const employees = page.locator('.nav-item[data-view-target="employees"]');
            await page.keyboard.press("Tab");
            await employees.focus();
            const outline = await employees.evaluate((element) => {
              const style = getComputedStyle(element);
              return {
                style: style.outlineStyle,
                width: parseFloat(style.outlineWidth)
              };
            });
            expect(outline.style).not.toBe("none");
            expect(outline.width).toBeGreaterThanOrEqual(2);
          });'''
          if test_source.count(old_test) != 1:
              raise SystemExit("tests/e2e/art-direction.spec.mjs: не найден точный тест фокуса")
          test_path.write_text(test_source.replace(old_test, new_test), encoding="utf-8")

          css_path = Path("apps/api/ui/template-row-flow.css")
          css_source = css_path.read_text(encoding="utf-8").rstrip()
          marker = "/* Коррекции, подтверждённые полным Chromium/axe-прогоном. */"
          if marker in css_source:
              raise SystemExit("apps/api/ui/template-row-flow.css: блок коррекций уже существует")
          css_source += '''

          /* Коррекции, подтверждённые полным Chromium/axe-прогоном. */
          .primary-button,
          .secondary-button {
            min-height: 44px;
          }

          .employee-row-status.is-active {
            color: #1f5f45;
            background: #e4eee8;
          }

          :root[data-theme="dark"] .employee-row-status.is-active {
            color: #9fe2bc;
            background: rgba(112, 207, 158, 0.14);
          }

          @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .employee-row-status.is-active {
              color: #9fe2bc;
              background: rgba(112, 207, 158, 0.14);
            }
          }

          .nav-item:focus,
          .mobile-nav button:focus {
            outline: 3px solid var(--accent-strong);
            outline-offset: 2px;
          }

          .home-hero .hero-copy {
            align-items: stretch;
          }

          .home-hero .hero-copy > * {
            min-width: 0;
            max-width: 100%;
          }

          .home-hero .hero-copy h2,
          .home-hero .hero-copy p,
          .home-hero .hero-copy .primary-button {
            overflow-wrap: anywhere;
            text-wrap: wrap;
          }

          .home-hero .hero-copy .primary-button {
            align-self: flex-start;
            white-space: normal;
          }

          @media (max-width: 820px) {
            .topbar-actions {
              justify-content: flex-start;
            }

            .topbar-actions .workspace-switcher-host {
              width: auto;
              max-width: none !important;
              flex: 1 1 0;
            }

            .topbar .context-chip {
              width: 100%;
              max-width: none !important;
            }

            .settings-row.management-tile {
              display: grid;
              min-height: 0;
              grid-template-columns: 36px minmax(0, 1fr) 16px;
              align-items: start;
              gap: 10px;
              padding: 14px;
            }

            .management-tile-icon {
              width: 36px;
              height: 36px;
              align-self: start;
              border-radius: 5px;
            }

            .management-tile-copy {
              min-width: 0;
            }

            .management-tile-copy strong,
            .management-tile-copy small,
            .management-tile-copy em {
              max-width: 100%;
              overflow-wrap: anywhere;
            }

            .management-chevron {
              align-self: center;
            }
          }

          @media (max-width: 620px) {
            .management-tile-copy em {
              display: none;
            }
          }
          '''
          css_path.write_text(css_source.strip() + "\n", encoding="utf-8")
          PY

          git diff --check
          node --check tests/e2e/art-direction.spec.mjs
          test "$(grep -R --include='*.css' -E 'outline:[[:space:]]*(none|0)(;|[[:space:]])' apps/api/ui/help-center.css apps/api/ui/help-project-documents.css apps/api/ui/styles.css | wc -l)" -eq 0

      - name: Commit audited corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/ui/help-center.css \
            apps/api/ui/help-project-documents.css \
            apps/api/ui/styles.css \
            apps/api/ui/template-row-flow.css \
            tests/e2e/art-direction.spec.mjs
          git diff --cached --check
          git commit -m 'Исправить регрессии полного арт-аудита'
          git push origin HEAD:agent/interface-art-direction
