name: Исправить структуру шаблона, PDF и CSP

on:
  push:
    branches:
      - fix/template-structure-preview-csp
    paths:
      - .github/workflows/apply-template-structure-preview-csp.yml
      - scripts/ci/apply-template-structure-preview-csp.py
      - scripts/ci/apply-optional-template-preview.py
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/template-structure-preview-csp
          fetch-depth: 0
          show-progress: false

      - name: Применить исправления
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/apply-template-structure-preview-csp.py 2>&1 | tee patch-structure.log
          first=${PIPESTATUS[0]}
          if [[ "$first" -eq 0 ]]; then
            python3 scripts/ci/apply-optional-template-preview.py 2>&1 | tee patch-preview.log
            second=${PIPESTATUS[0]}
          else
            second=1
          fi
          exit $(( first || second ))

      - name: Сохранить диагностику применения
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: template-structure-preview-patch-diagnostic
          path: patch-*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Остановиться после ошибки применения
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Проверить синтаксис интерфейса и CSP
        run: |
          node --check apps/api/ui/template-activation.js
          node --check apps/api/ui/document-generation.js
          node --check apps/api/ui/operation-center.js
          node scripts/ci/check-ui-csp.mjs

      - name: Зафиксировать итоговое изменение
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-template-structure-preview-csp.py \
            scripts/ci/apply-optional-template-preview.py \
            .github/workflows/apply-template-structure-preview-csp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Сохранить структуру таблицы и сделать PDF необязательным'
          git push origin HEAD:fix/template-structure-preview-csp
