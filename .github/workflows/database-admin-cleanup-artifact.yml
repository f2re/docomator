name: Apply database admin cleanup

on:
  push:
    branches:
      - agent/database-admin-hardening

permissions:
  contents: write

concurrency:
  group: database-admin-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/database-admin-hardening
          fetch-depth: 0

      - name: Apply exact cleanup and remove workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(relative: str, old: str, new: str) -> None:
              path = Path(relative)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one exact block, found {count}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          replace_exact(
              "scripts/offline/install.sh",
              '''if [[ "$(read_env_value "$CONFIG_FILE" DOCOMATOR_SESSION_SECRET)" == "CHANGE_ME_DURING_INSTALL" || -z "$(read_env_value "$CONFIG_FILE" DOCOMATOR_SESSION_SECRET)" ]]; then
            replace_env_value "$CONFIG_FILE" DOCOMATOR_SESSION_SECRET "$(random_secret)"
          fi

          ''',
              "",
          )
          replace_exact(
              "scripts/offline/lib.sh",
              '''random_secret() {
            od -An -N32 -tx1 /dev/urandom | tr -d ' \\n'
          }

          ''',
              "",
          )
          PY
          rm .github/workflows/database-admin-cleanup-artifact.yml
          bash -n scripts/offline/install.sh scripts/offline/lib.sh
          ! grep -R "DOCOMATOR_SESSION_SECRET\|random_secret" config scripts/offline
          git diff --check
          git config user.name "docomator-maintenance"
          git config user.email "docomator-maintenance@users.noreply.github.com"
          git add scripts/offline/install.sh scripts/offline/lib.sh .github/workflows/database-admin-cleanup-artifact.yml
          git commit -m "Удалить устаревший секрет сессии из установки"
          git push origin HEAD:agent/database-admin-hardening
