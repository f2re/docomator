              '''  "$SCRIPT_DIR/first-run.sh" \\\n  "$SCRIPT_DIR/healthcheck.mjs" \\\n  "$SCRIPT_DIR/http-check.mjs" \\\n''',
              '''  "$SCRIPT_DIR/first-run.sh" \\\n  "$SCRIPT_DIR/set-password.sh" \\\n  "$SCRIPT_DIR/set-password.mjs" \\\n  "$SCRIPT_DIR/healthcheck.mjs" \\\n  "$SCRIPT_DIR/http-check.mjs" \\\n'''
