          marker = '''  if [[ -x "$BUNDLE_ROOT/first-run.sh" ]]; then\n    cp "$BUNDLE_ROOT/first-run.sh" "$TEMP_RELEASE/first-run.sh"\n    chmod 0755 "$TEMP_RELEASE/first-run.sh"\n  fi\n'''
          replacement = marker + '''  if [[ -x "$BUNDLE_ROOT/set-password.sh" && -f "$BUNDLE_ROOT/set-password.mjs" ]]; then\n    cp "$BUNDLE_ROOT/set-password.sh" "$TEMP_RELEASE/set-password.sh"\n    cp "$BUNDLE_ROOT/set-password.mjs" "$TEMP_RELEASE/set-password.mjs"\n    chmod 0755 "$TEMP_RELEASE/set-password.sh" "$TEMP_RELEASE/set-password.mjs"\n  fi\n'''
          if text.count(marker) != 1:
              raise SystemExit('install first-run copy marker not found')
          install.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          # Adjust first-run fallback paths to the immutable-release root copy.
          first_run = Path('scripts/offline/first-run.sh')
          text = first_run.read_text(encoding='utf-8').replace(
              '/opt/docomator/current/app/scripts/offline/set-password.sh',
              '/opt/docomator/current/set-password.sh'
          )
          first_run.write_text(text, encoding='utf-8')
          set_password = Path('scripts/offline/set-password.sh')
          text = set_password.read_text(encoding='utf-8').replace(
              '/opt/docomator/current/app/scripts/offline/set-password.mjs',
              '/opt/docomator/current/set-password.mjs'
          )
