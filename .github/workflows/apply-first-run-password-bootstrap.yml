name: Apply first-run password bootstrap

on:
  push:
    branches:
      - fix/first-run-password-bootstrap

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "feat(auth): add first-run password bootstrap [bootstrap-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Implement first-run bootstrap
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Add additive migration: the shared password hash belongs to the global password gate,
          # not to a space. The session signing secret remains target-host configuration.
          Path('migrations/0031_shared_access_password.sql').write_text('''-- One shared application password, no users/roles/ACL.\nCREATE TABLE shared_access_password (\n  singleton INTEGER PRIMARY KEY CHECK (singleton = 1),\n  password_hash TEXT NOT NULL,\n  configured_at TEXT NOT NULL\n);\n''', encoding='utf-8')

          # Patch password gate with a tiny persistence port backed by SQLite.
          gate = Path('apps/api/src/password-gate.ts')
          text = gate.read_text(encoding='utf-8')
          replace_marker = 'import type { FastifyInstance, FastifyReply, FastifyRequest } from "fastify";\n\nimport { correlationId } from "./request-context.js";'
          replacement = '''import type { FastifyInstance, FastifyReply, FastifyRequest } from "fastify";\nimport type { SqliteStore } from "@docomator/storage";\n\nimport { correlationId } from "./request-context.js";'''
          if text.count(replace_marker) != 1:
              raise SystemExit('password-gate import marker not found')
          text = text.replace(replace_marker, replacement, 1)

          text = text.replace('''interface LoginBody {\n  password: string;\n}\n''', '''interface LoginBody {\n  password: string;\n}\n\ninterface SetupBody {\n  password: string;\n  confirmation: string;\n}\n\nexport interface PasswordCredentialStore {\n  readPasswordHash(): string | null;\n  configurePasswordHash(passwordHash: string): boolean;\n}\n\nexport function createSqlitePasswordCredentialStore(\n  store: SqliteStore\n): PasswordCredentialStore {\n  return {\n    readPasswordHash() {\n      return store.execute((executor) => {\n        const row = executor\n          .prepare(\n            "SELECT password_hash FROM shared_access_password WHERE singleton = 1"\n          )\n          .get() as { password_hash?: unknown } | undefined;\n        if (row === undefined) return null;\n        if (typeof row.password_hash !== "string" || row.password_hash.length === 0) {\n          throw new Error("Состояние общего пароля повреждено.");\n        }\n        return row.password_hash;\n      });\n    },\n    configurePasswordHash(passwordHash) {\n      return store.transaction((executor) => {\n        const result = executor\n          .prepare(\n            "INSERT OR IGNORE INTO shared_access_password (singleton, password_hash, configured_at) VALUES (1, ?, ?)"\n          )\n          .run(passwordHash, new Date().toISOString());\n        return Number(result.changes) === 1;\n      });\n    }\n  };\n}\n''', 1)

          text = text.replace('''    "/api/v1/auth/status",\n    "/api/v1/auth/login",\n    "/api/v1/auth/logout"''', '''    "/api/v1/auth/status",\n    "/api/v1/auth/setup",\n    "/api/v1/auth/login",\n    "/api/v1/auth/logout"''', 1)

          start = text.index('function loginHtml(configured: boolean): string {')
          end = text.index('\nfunction loginDelayMs', start)
          replacement_block = r'''function loginHtml(configured: boolean): string {
  const title = configured ? "Вход" : "Первый запуск";
  const setup = configured
    ? "Введите общий пароль приложения «Оформлятор»."
    : "Создайте общий пароль. Он будет использоваться всеми допущенными сотрудниками этого локального контура.";
  const confirmation = configured
    ? ""
    : '<label for="confirmation">Повторите пароль</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="512" required>';
  const hint = configured
    ? ""
    : '<div class="hint">Это одноразовая настройка. После сохранения мастер первого запуска больше не откроется.</div>';
  return `<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f3f1eb" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#151817" media="(prefers-color-scheme: dark)"><title>${title} — Оформлятор</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Liberation Sans","DejaVu Sans",sans-serif;color-scheme:light dark;--bg:#f3f1eb;--surface:#fffefa;--surface-2:#eeece5;--text:#20262b;--muted:#59636b;--border:rgba(32,38,43,.18);--border-strong:rgba(32,38,43,.30);--accent:#176b78;--accent-strong:#105763;--danger:#a33b3f}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text)}.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;padding:28px;box-shadow:0 8px 24px rgba(32,38,43,.07)}h1{margin:0 0 8px;font-size:28px;line-height:1.15;letter-spacing:-.02em}p{margin:0 0 22px;color:var(--muted);line-height:1.5}label{display:block;font-weight:650;margin:14px 0 8px}input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--text);font:inherit}button{width:100%;min-height:46px;margin-top:18px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--accent-strong);border-color:var(--accent-strong)}input:focus-visible,button:focus-visible{outline:3px solid var(--accent-strong);outline-offset:2px}button:disabled{opacity:.55;cursor:default}.error{margin-top:14px;color:var(--danger);font-size:14px;line-height:1.45}.hint{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.45}.brand{margin-bottom:18px;color:var(--muted);font-size:13px;font-weight:650}@media(prefers-color-scheme:dark){:root{--bg:#151817;--surface:#1e2220;--surface-2:#272c29;--text:#f3f2ed;--muted:#bdc4bf;--border:rgba(243,242,237,.14);--border-strong:rgba(243,242,237,.28);--accent:#1f7184;--accent-strong:#286174;--danger:#ef8a8e}.card{box-shadow:0 10px 28px rgba(0,0,0,.25)}}</style><script src="/auth.js" defer></script></head>
<body><main class="card"><div class="brand">Оформлятор · локальный контур</div><h1>${title}</h1><p>${setup}</p><form id="authForm" data-mode="${configured ? "login" : "setup"}"><label for="password">${configured ? "Пароль" : "Новый общий пароль"}</label><input id="password" name="password" type="password" autocomplete="${configured ? "current-password" : "new-password"}" minlength="${configured ? "1" : "12"}" maxlength="512" required autofocus>${confirmation}<button id="authButton" type="submit">${configured ? "Войти" : "Сохранить пароль и продолжить"}</button>${hint}<div class="error" id="authError" role="alert" hidden></div></form></main></body></html>`;
}

const authScript = `(() => {\n  const form = document.querySelector("#authForm");\n  if (!form) return;\n  const password = document.querySelector("#password");\n  const confirmation = document.querySelector("#confirmation");\n  const button = document.querySelector("#authButton");\n  const error = document.querySelector("#authError");\n  form.addEventListener("submit", async (event) => {\n    event.preventDefault();\n    error.hidden = true;\n    if (form.dataset.mode === "setup" && confirmation.value !== password.value) {\n      error.textContent = "Пароли не совпадают. Проверьте повторный ввод.";\n      error.hidden = false;\n      confirmation.focus();\n      return;\n    }\n    button.disabled = true;\n    try {\n      const setup = form.dataset.mode === "setup";\n      const endpoint = setup ? "/api/v1/auth/setup" : "/api/v1/auth/login";\n      const payload = setup ? { password: password.value, confirmation: confirmation.value } : { password: password.value };\n      const response = await fetch(endpoint, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });\n      const body = await response.json().catch(() => ({}));\n      if (!response.ok) throw new Error(body?.error?.message || (setup ? "Не удалось сохранить пароль." : "Не удалось войти."));\n      const next = new URLSearchParams(location.search).get("next") || "/";\n      location.replace(next.startsWith("/") && !next.startsWith("//") ? next : "/");\n    } catch (cause) {\n      error.textContent = cause instanceof Error ? cause.message : "Операция не выполнена.";\n      error.hidden = false;\n      password.select();\n    } finally { button.disabled = false; }\n  });\n})();\n`;
'''
          text = text[:start] + replacement_block + text[end:]

          old_hook = '''  app.addHook("onRequest", async (request, reply) => {\n    if (config.mode === "disabled" || publicPath(request.url)) return;\n    if (!sameOriginMutation(request)) {'''
          new_hook = '''  app.addHook("onRequest", async (request, reply) => {\n    if (config.mode === "disabled") return;\n    if (!sameOriginMutation(request)) {'''
          if text.count(old_hook) != 1:
              raise SystemExit('onRequest hook marker not found')
          text = text.replace(old_hook, new_hook, 1)
          hook_tail = '''        "Запрос с другого сайта отклонён. Откройте «Оформлятор» напрямую."\n      );\n    }\n    if (sessionFromRequest(request, config).valid) return;'''
          hook_replacement = '''        "Запрос с другого сайта отклонён. Откройте «Оформлятор» напрямую."\n      );\n    }\n    if (publicPath(request.url)) return;\n    if (sessionFromRequest(request, config).valid) return;'''
          if text.count(hook_tail) != 1:
              raise SystemExit('onRequest hook tail marker not found')
          text = text.replace(hook_tail, hook_replacement, 1)

          signature = '''export function installPasswordGate(\n  app: FastifyInstance,\n  config: PasswordGateConfig\n): void {\n  const failures = new Map<string, FailureState>();'''
          signature_new = '''export function installPasswordGate(\n  app: FastifyInstance,\n  config: PasswordGateConfig,\n  credentials?: PasswordCredentialStore\n): void {\n  if (config.mode === "required" && config.passwordHash === null && credentials !== undefined) {\n    const storedHash = credentials.readPasswordHash();\n    if (storedHash !== null) {\n      parsePasswordHash(storedHash);\n      config.passwordHash = storedHash;\n    }\n  }\n  const failures = new Map<string, FailureState>();'''
          if text.count(signature) != 1:
              raise SystemExit('installPasswordGate signature marker not found')
          text = text.replace(signature, signature_new, 1)

          status_marker = '''  app.post<{ Body: LoginBody }>(\n    "/api/v1/auth/login",'''
          setup_route = r'''  app.post<{ Body: SetupBody }>(
    "/api/v1/auth/setup",
    {
      schema: {
        body: {
          type: "object",
          additionalProperties: false,
          required: ["password", "confirmation"],
          properties: {
            password: { type: "string", minLength: 1, maxLength: MAX_PASSWORD_LENGTH },
            confirmation: { type: "string", minLength: 1, maxLength: MAX_PASSWORD_LENGTH }
          }
        }
      }
    },
    async (request, reply) => {
      reply.header("cache-control", "no-store");
      if (config.mode !== "required" || sessionConfigured(config)) {
        return apiError(
          request,
          reply,
          409,
          "password_already_configured",
          "Общий пароль уже настроен. Обновите страницу и войдите."
        );
      }
      if (credentials === undefined) {
        return apiError(
          request,
          reply,
          503,
          "password_setup_unavailable",
          "Первичная настройка пароля недоступна в этом режиме запуска."
        );
      }
      if (config.sessionSecret === null) {
        return apiError(
          request,
          reply,
          503,
          "session_secret_not_configured",
          "Секрет сеансов не создан установщиком. Повторите штатное обновление или установку."
        );
      }
      if (request.body.password !== request.body.confirmation) {
        return apiError(
          request,
          reply,
          400,
          "password_confirmation_mismatch",
          "Пароли не совпадают. Проверьте повторный ввод."
        );
      }
      let passwordHash: string;
      try {
        passwordHash = hashAccessPassword(request.body.password);
      } catch (error) {
        return apiError(
          request,
          reply,
          400,
          "invalid_password_policy",
          error instanceof Error ? error.message : "Пароль не соответствует требованиям."
        );
      }
      if (!credentials.configurePasswordHash(passwordHash)) {
        const storedHash = credentials.readPasswordHash();
        if (storedHash !== null) {
          parsePasswordHash(storedHash);
          config.passwordHash = storedHash;
        }
        return apiError(
          request,
          reply,
          409,
          "password_already_configured",
          "Общий пароль уже был настроен в другом запросе. Обновите страницу и войдите."
        );
      }
      config.passwordHash = passwordHash;
      const token = createSessionToken(config.sessionSecret, config.sessionTtlSeconds);
      reply.header(
        "set-cookie",
        sessionCookie(request, token, config.sessionTtlSeconds)
      );
      return {
        data: { authenticated: true, configured: true },
        correlationId: correlationId(request)
      };
    }
  );

'''
          if text.count(status_marker) != 1:
              raise SystemExit('login route marker not found')
          text = text.replace(status_marker, setup_route + status_marker, 1)
          gate.write_text(text, encoding='utf-8')

          # Wire SQLite-backed password credentials into the real server.
          server = Path('apps/api/src/server.ts')
          replace_once(
              server,
              '''  installPasswordGate,\n  loadPasswordGateConfig\n} from "./password-gate.js";''',
              '''  createSqlitePasswordCredentialStore,\n  installPasswordGate,\n  loadPasswordGateConfig\n} from "./password-gate.js";'''
          )
          replace_once(
              server,
              'installPasswordGate(app, loadPasswordGateConfig());',
              'installPasswordGate(\n  app,\n  loadPasswordGateConfig(),\n  createSqlitePasswordCredentialStore(store)\n);'
          )

          # Installer creates the signing secret itself; the first password is then set in browser.
          install = Path('scripts/offline/install.sh')
          marker = '''if ! DOCOMATOR_DATA_DIR="$DATA_DIR" \\\n  "$RELEASE_DIR/runtime/node/bin/node" \\\n  "$RELEASE_DIR/app/scripts/runtime/migrate.mjs"; then'''
          secret_block = '''SESSION_SECRET="$(read_env_value "$CONFIG_FILE" DOCOMATOR_SESSION_SECRET)"\nif [[ -z "$SESSION_SECRET" ]]; then\n  SESSION_SECRET="$("$RELEASE_DIR/runtime/node/bin/node" -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("base64url"))')"\n  [[ ${#SESSION_SECRET} -ge 32 ]] || die "Не удалось создать секрет сеансов"\n  replace_env_value "$CONFIG_FILE" DOCOMATOR_SESSION_SECRET "$SESSION_SECRET"\n  chmod 0640 "$CONFIG_FILE"\n  chown root:"$DOCOMATOR_GROUP" "$CONFIG_FILE"\n  info "Создан локальный секрет сеансов; общий пароль задаётся при первом открытии интерфейса"\nfi\n\n'''
          text = install.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('install migration marker not found')
          install.write_text(text.replace(marker, secret_block + marker, 1), encoding='utf-8')

          # Add local fallback helper. It deliberately calls the same bootstrap API as the browser.
          Path('scripts/offline/set-password.mjs').write_text(r'''#!/usr/bin/env node
import process from "node:process";

let baseUrl = "http://127.0.0.1:8080";
for (let index = 2; index < process.argv.length; index += 1) {
  const argument = process.argv[index];
  if (argument === "--url") {
    const value = process.argv[index + 1];
    if (value === undefined) throw new Error("После --url требуется адрес.");
    baseUrl = value;
    index += 1;
  } else {
    throw new Error(`Неизвестный параметр: ${argument}`);
  }
}
const parsed = new URL(baseUrl);
if (!new Set(["http:", "https:"]).has(parsed.protocol)) {
  throw new Error("Разрешён только http/https адрес локального Оформлятора.");
}
let input = "";
for await (const chunk of process.stdin) input += chunk.toString("utf8");
const [password = "", confirmation = ""] = input.replaceAll("\r", "").split("\n");
if (password.length === 0 || confirmation.length === 0) {
  throw new Error("Пароль и подтверждение не получены.");
}
const response = await fetch(new URL("/api/v1/auth/setup", parsed), {
  method: "POST",
  headers: {
    "content-type": "application/json",
    origin: parsed.origin
  },
  body: JSON.stringify({ password, confirmation })
});
const body = await response.json().catch(() => ({}));
if (!response.ok) {
  throw new Error(body?.error?.message ?? `Настройка пароля не выполнена: HTTP ${response.status}`);
}
process.stdout.write("Общий пароль Оформлятора настроен. Теперь можно войти через браузер.\n");
''', encoding='utf-8')

          Path('scripts/offline/set-password.sh').write_text(r'''#!/usr/bin/env bash
set -Eeuo pipefail

CONFIG_FILE="/etc/docomator/docomator.env"
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

if [[ ${1:-} == "--config" ]]; then
  CONFIG_FILE="$2"
  shift 2
fi
(($# == 0)) || { printf 'Использование: set-password.sh [--config ФАЙЛ]\n' >&2; exit 2; }
[[ -t 0 ]] || { printf 'Пароль задаётся интерактивно из терминала.\n' >&2; exit 2; }

read_value() {
  local key="$1"
  [[ -f "$CONFIG_FILE" ]] || return 0
  grep -E "^[[:space:]]*${key}=" "$CONFIG_FILE" | tail -n 1 | cut -d= -f2- || true
}

HOST="$(read_value DOCOMATOR_HOST)"
PORT="$(read_value DOCOMATOR_PORT)"
[[ -n "$HOST" ]] || HOST="127.0.0.1"
[[ -n "$PORT" ]] || PORT="8080"
case "$HOST" in 0.0.0.0|::) HOST="127.0.0.1" ;; esac
URL="http://${HOST}:${PORT}"

NODE=""
HELPER=""
for candidate in \
  /opt/docomator/current/runtime/node/bin/node \
  "$SCRIPT_DIR/payload/runtime/node/bin/node"; do
  [[ -x "$candidate" ]] && NODE="$candidate" && break
done
for candidate in \
  /opt/docomator/current/app/scripts/offline/set-password.mjs \
  "$SCRIPT_DIR/set-password.mjs"; do
  [[ -f "$candidate" ]] && HELPER="$candidate" && break
done
[[ -n "$NODE" && -n "$HELPER" ]] || { printf 'Не найден локальный помощник настройки пароля.\n' >&2; exit 1; }

read -r -s -p 'Новый общий пароль (не менее 12 символов): ' PASSWORD
printf '\n'
read -r -s -p 'Повторите пароль: ' CONFIRMATION
printf '\n'
if [[ "$PASSWORD" != "$CONFIRMATION" ]]; then
  unset PASSWORD CONFIRMATION
  printf 'Пароли не совпадают.\n' >&2
  exit 2
fi
printf '%s\n%s\n' "$PASSWORD" "$CONFIRMATION" | "$NODE" "$HELPER" --url "$URL"
unset PASSWORD CONFIRMATION
''', encoding='utf-8')

          # First-run helper no longer lies about a missing script or env-only hash.
          first_run = Path('scripts/offline/first-run.sh')
          text = first_run.read_text(encoding='utf-8')
          start = text.index('PASSWORD_HASH="$(read_value DOCOMATOR_ACCESS_PASSWORD_HASH)"')
          end = text.index('\nif ((RUN_CHECK == 1));', start)
          replacement = '''printf '🔒 При первом открытии Оформлятор предложит создать общий пароль в браузере.\\n'\nprintf '   Если браузер недоступен, используйте локальный помощник:\\n'\nprintf '   sudo bash /opt/docomator/current/app/scripts/offline/set-password.sh\\n\\n'\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('После настройки общего пароля откройте интерфейс:', 'Откройте интерфейс; при первом запуске создайте общий пароль прямо на странице:')
          text = text.replace('1. 🔒 Если пароль ещё не задан: sudo bash /opt/docomator/current/app/scripts/offline/set-password.sh\n  2. 🔑 Откройте интерфейс и войдите по общему паролю.', '1. 🔒 Откройте интерфейс и при первом запуске создайте общий пароль на странице.\n  2. 🔑 Последующие входы выполняются по этому общему паролю; локальный set-password.sh остаётся запасным способом.')
          first_run.write_text(text, encoding='utf-8')

          # Bundle the fallback helper beside the existing first-run helper.
          prepare = Path('scripts/offline/prepare-bundle.sh')
          replace_once(
