name: Apply import error localization

on:
  push:
    branches:
      - fix/import-error-localization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "fix(import): localize typed import errors [import-fix-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply vertical fix and verify final tree
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          cat scripts/ci/import-error-localization.part* | tr -d '\n\r' | base64 -d | gzip -dc > /tmp/apply-import-error-localization.py
          python3 scripts/ci/import-error-localization-hotfix.py /tmp/apply-import-error-localization.py
          python3 /tmp/apply-import-error-localization.py
          npm run version:bump -- patch
          python3 /tmp/apply-import-error-localization.py --after-bump

          rm -f \
            .github/workflows/apply-import-error-localization.yml \
            scripts/ci/apply-import-error-localization.py.gz.b64 \
            scripts/ci/import-error-localization-hotfix.py \
            scripts/ci/import-error-localization.part01 \
            scripts/ci/import-error-localization.part02 \
            scripts/ci/import-error-localization.part03 \
            scripts/ci/import-error-localization.part04 \
            scripts/ci/import-error-localization.part05 \
            scripts/ci/import-error-localization.part06
          git add -A

          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check
          test ! -e .github/workflows/apply-import-error-localization.yml
          test -z "$(find scripts/ci -maxdepth 1 \( -name 'import-error-localization*' -o -name 'apply-import-error-localization*' \) -print -quit)"

      - name: Commit verified implementation
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(import): localize typed import errors [import-fix-applied]"
          git push origin HEAD:fix/import-error-localization
