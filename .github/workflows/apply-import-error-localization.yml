name: Apply import error localization

on:
  push:
    branches:
      - fix/import-error-localization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "fix(import): localize typed import errors [import-fix-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply vertical fix
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          cat scripts/ci/import-error-localization.part* | tr -d '\n\r' | base64 -d | gzip -dc > /tmp/apply-import-error-localization.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          patcher = Path('/tmp/apply-import-error-localization.py')
          text = patcher.read_text(encoding='utf-8')

          old = r'''  constructor(\n    readonly code: XlsxImportParseErrorCode,\n    message: string,\n    readonly suggestedAction: string\n  ) {\n    super(message);\n  }'''
          new = r'''  readonly code: XlsxImportParseErrorCode;\n  readonly suggestedAction: string;\n\n  constructor(\n    codeOrMessage: XlsxImportParseErrorCode | string,\n    message?: string,\n    suggestedAction?: string\n  ) {\n    const typed = message !== undefined;\n    super(typed ? message : codeOrMessage);\n    this.code = typed\n      ? (codeOrMessage as XlsxImportParseErrorCode)\n      : "xlsx_structure_invalid";\n    this.suggestedAction = typed\n      ? (suggestedAction ?? "Откройте книгу в Excel/LibreOffice, сохраните обычный XLSX и повторите импорт.")\n      : "Откройте книгу в Excel/LibreOffice, сохраните обычный XLSX и повторите импорт.";\n  }'''
          if old not in text:
              raise SystemExit('xlsx constructor patch target not found')
          text = text.replace(old, new, 1)
          guard = '''# Guard against forgotten old constructor calls.\nif re.search(r'new XlsxImportParseError\\(\\s*["`]', text):\n    raise SystemExit('unconverted XlsxImportParseError constructor remains')\n'''
          if guard not in text:
              raise SystemExit('xlsx constructor guard not found')
          text = text.replace(guard, '# Remaining one-argument XLSX errors use the typed generic fallback.\n', 1)

          old_marker = r'''marker = 'Физический номер исходной строки сохраняется и показывается в отчёте ошибок.\n' '''.rstrip()
          new_marker = r'''marker = 'В предварительном просмотре отображается колонка **Строка файла** и предупреждения парсера. Это позволяет сверить разреженную таблицу до изменения базы.\n' '''.rstrip()
          if old_marker not in text:
              raise SystemExit('import docs source marker target not found')
          text = text.replace(old_marker, new_marker, 1)

          parser_step = r'''# 7. Parser wraps CSV/XLSX failures into structured file-level issues and detects legacy XLS.\nparser_path = Path("apps/api/src/data-import-parser.ts")\ntext = read(parser_path)\ntext = replace_once(\n    text,\n    'import { createHash } from "node:crypto";\\n\\n',\n    'import { createHash } from "node:crypto";\\n\\nimport type { DataImportOperationIssue } from "@docomator/storage";\\n\\n',\n    "parser storage issue import"\n)\ntext = replace_once(\n    text,\n    'import { parseCsvImportRows, type ParsedCsvImportRow } from "./csv-import-parser.js";',\n    'import { CsvImportParseError, parseCsvImportRows, type ParsedCsvImportRow } from "./csv-import-parser.js";',\n    "parser CSV error import"\n)\ntext = replace_once(\n    text,\n    'import { parseXlsxImportRows, type ParsedXlsxImportRow } from "./xlsx-import-parser.js";',\n    'import { XlsxImportParseError, parseXlsxImportRows, type ParsedXlsxImportRow } from "./xlsx-import-parser.js";',\n    "parser XLSX error import"\n)\nold_class = '''export class DataImportParseError extends Error {\n  override readonly name = "DataImportParseError";\n}\n'''\nnew_class = '''export class DataImportParseError extends Error {\n  override readonly name = "DataImportParseError";\n  readonly issue: DataImportOperationIssue;\n\n  constructor(issueOrMessage: DataImportOperationIssue | string) {\n    const issue = typeof issueOrMessage === "string"\n      ? ({\n          code: "data_import_parse_failed",\n          scope: "file",\n          blockingEffect: "file",\n          severity: "error",\n          rowNumber: null,\n          column: null,\n          propertyKey: null,\n          rawValue: null,\n          message: issueOrMessage,\n          suggestedAction: "Исправьте файл по описанию ошибки и повторите проверку; выбранные настройки импорта сохранены."\n        } as DataImportOperationIssue)\n      : issueOrMessage;\n    super(issue.message);\n    this.issue = issue;\n  }\n}\n\nfunction parseFailure(\n  code: string,\n  message: string,\n  suggestedAction: string\n): DataImportParseError {\n  return new DataImportParseError({\n    code,\n    scope: "file",\n    blockingEffect: "file",\n    severity: "error",\n    rowNumber: null,\n    column: null,\n    propertyKey: null,\n    rawValue: null,\n    message,\n    suggestedAction\n  } as DataImportOperationIssue);\n}\n'''\ntext = replace_once(text, old_class, new_class, "parser typed error class")\nstart = text.index('export async function parseDataImportBuffer(input: {')\nnew_parse = '''export async function parseDataImportBuffer(input: {\n  buffer: Uint8Array;\n  fileName: string;\n}): Promise<ParsedDataImportTable> {\n  const buffer = Buffer.from(input.buffer);\n  if (buffer.length < 1 || buffer.length > MAX_FILE_BYTES) {\n    throw parseFailure(\n      "data_import_file_size_invalid",\n      "Файл импорта должен иметь размер от 1 байта до 8 МБ.",\n      "Выберите непустой CSV/XLSX размером не более 8 МБ."\n    );\n  }\n  const fileName = input.fileName.normalize("NFKC").trim();\n  const extension = /\\.([^.]+)$/u.exec(fileName)?.[1]?.toLowerCase();\n  const sourceSha256 = createHash("sha256").update(buffer).digest("hex");\n  const oleSignature =\n    buffer.length >= 8 &&\n    buffer.subarray(0, 8).equals(Buffer.from([0xd0, 0xcf, 0x11, 0xe0, 0xa1, 0xb1, 0x1a, 0xe1]));\n\n  if (extension === "xls" || oleSignature) {\n    throw parseFailure(\n      "unsupported_legacy_xls",\n      "Этот файл сохранён в старом формате Excel 97–2003 (.xls).",\n      "Откройте таблицу в Excel или LibreOffice, сохраните её как XLSX или CSV и загрузите снова. Сопоставления и введённые настройки не сбрасываются."\n    );\n  }\n\n  if (extension === "csv") {\n    try {\n      const parsed = parseCsvImportRows(buffer);\n      return buildTable({\n        fileName,\n        fileFormat: "csv",\n        sourceSha256,\n        sourceRows: parsed.rows,\n        warnings: [\n          `Разделитель CSV: ${parsed.delimiter === "\\t" ? "табуляция" : parsed.delimiter}`\n        ]\n      });\n    } catch (error) {\n      if (error instanceof CsvImportParseError) {\n        throw parseFailure(\n          error.code,\n          error.message,\n          error.suggestedAction\n        );\n      }\n      throw error;\n    }\n  }\n\n  if (extension === "xlsx") {\n    if (buffer[0] !== 0x50 || buffer[1] !== 0x4b) {\n      throw parseFailure(\n        "xlsx_invalid_container",\n        "Файл с расширением .xlsx не является книгой XLSX.",\n        "Откройте исходный файл в Excel или LibreOffice и сохраните его как обычный XLSX."\n      );\n    }\n    try {\n      const parsed = await parseXlsxImportRows(buffer);\n      return buildTable({\n        fileName,\n        fileFormat: "xlsx",\n        sourceSha256,\n        sourceRows: parsed.rows,\n        warnings: parsed.warnings\n      });\n    } catch (error) {\n      if (error instanceof XlsxImportParseError) {\n        throw parseFailure(\n          error.code,\n          error.message,\n          error.suggestedAction\n        );\n      }\n      throw error;\n    }\n  }\n\n  throw parseFailure(\n    "data_import_format_unsupported",\n    "Поддерживаются файлы CSV и XLSX.",\n    "Выберите CSV/XLSX. Для старого .xls сначала сохраните таблицу как XLSX или CSV."\n  );\n}\n'''\ntext = text[:start] + new_parse\nwrite(parser_path, text)\n\n'''
          match = re.search(r'# 7\.[\s\S]*?(?=# 8\.)', text)
          if match is None:
              raise SystemExit('parser patch section not found')
          text = text[:match.start()] + parser_step + text[match.end():]
          patcher.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/apply-import-error-localization.py
          npm run version:bump -- patch
          python3 /tmp/apply-import-error-localization.py --after-bump
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check

      - name: Commit verified implementation
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(import): localize typed import errors [import-fix-applied]"
          git push origin HEAD:fix/import-error-localization
