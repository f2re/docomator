name: Применить нормализацию импорта

on:
  push:
    branches:
      - feature/import-normalization-db-admin
    paths:
      - scripts/ci/apply-import-normalization-core.py
      - .github/workflows/apply-import-normalization-core.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/ci/apply-import-normalization-core.py
      - .github/workflows/apply-import-normalization-core.yml

permissions:
  contents: write

concurrency:
  group: apply-import-normalization-core
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/import-normalization-db-admin
          fetch-depth: 0
      - name: Применить изменения
        run: |
          python3 scripts/ci/apply-import-normalization-core.py
          python3 - <<'PY'
          from pathlib import Path

          routes = Path('apps/api/src/data-import-routes.ts')
          value = routes.read_text(encoding='utf-8')
          old = '''  const expectedToken = createImportPreviewToken({
              sourceSha256: body.sourceSha256.toLowerCase(),
              headers: body.headers,
              rows: body.rows,
              sourceRowNumbers: body.sourceRowNumbers
            });'''
          new = '''  const expectedToken = createImportPreviewToken({
              sourceSha256: body.sourceSha256.toLowerCase(),
              headers: body.headers,
              rows: body.rows,
              ...(body.sourceRowNumbers === undefined
                ? {}
                : { sourceRowNumbers: body.sourceRowNumbers })
            });'''
          if value.count(old) != 1:
              raise RuntimeError(f'preview token block count: {value.count(old)}')
          routes.write_text(value.replace(old, new, 1), encoding='utf-8')

          xlsx = Path('apps/api/src/xlsx-import-parser.ts')
          value = xlsx.read_text(encoding='utf-8')
          old = 'export async function parseXlsxImport(buffer: Uint8Array): Promise<ParsedXlsxImport> {'
          new = 'export async function parseXlsxImportRows(buffer: Uint8Array): Promise<ParsedXlsxImport> {'
          if value.count(old) != 1:
              raise RuntimeError(f'xlsx export count: {value.count(old)}')
          value = value.replace(old, new, 1)
          value += '''\nexport async function parseXlsxImport(buffer: Uint8Array): Promise<string[][]> {\n  return (await parseXlsxImportRows(buffer)).rows.map((row) => row.cells);\n}\n'''
          xlsx.write_text(value, encoding='utf-8')

          parser = Path('apps/api/src/data-import-parser.ts')
          value = parser.read_text(encoding='utf-8')
          value = value.replace(
              'import { parseCsvImport, type ParsedCsvImportRow } from "./csv-import-parser.js";',
              'import { parseCsvImportRows, type ParsedCsvImportRow } from "./csv-import-parser.js";',
              1,
          )
          value = value.replace(
              'import { parseXlsxImport, type ParsedXlsxImportRow } from "./xlsx-import-parser.js";',
              'import { parseXlsxImportRows, type ParsedXlsxImportRow } from "./xlsx-import-parser.js";',
              1,
          )
          value = value.replace('const parsed = parseCsvImport(buffer);', 'const parsed = parseCsvImportRows(buffer);', 1)
          value = value.replace('const parsed = await parseXlsxImport(buffer);', 'const parsed = await parseXlsxImportRows(buffer);', 1)
          parser.write_text(value, encoding='utf-8')
          PY
      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить сборку и тесты ядра
        run: |
          npm run build
          npm run test -w @docomator/storage
          npm run test -w @docomator/api
      - name: Зафиксировать изменения
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/ci/apply-import-normalization-core.py .github/workflows/apply-import-normalization-core.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Добавить нормализацию регистра и разделение ФИО'
          git push origin HEAD:feature/import-normalization-db-admin
