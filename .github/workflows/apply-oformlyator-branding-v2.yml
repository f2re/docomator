name: Apply Oformlyator branding v2

on:
  push:
    branches:
      - fix/oformlyator-branding

permissions:
  contents: write

jobs:
  apply-branding:
    if: "github.event.head_commit.message != 'chore: rename product to Оформлятор [branding-applied]'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply branding and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/apply-oformlyator-branding.py
          node --check scripts/ci/check-branding.mjs
          node scripts/ci/check-branding.mjs
          git diff --check
      - name: Commit transformed tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No branding changes to commit."
            exit 0
          fi
          git commit -m "chore: rename product to Оформлятор [branding-applied]"
          git push origin HEAD:fix/oformlyator-branding
