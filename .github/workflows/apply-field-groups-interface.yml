name: Добавить группы полей в интерфейс

on:
  push:
    branches:
      - fix/property-groups-searchable-select
    paths:
      - .github/workflows/apply-field-groups-interface.yml
      - scripts/ci/apply-field-groups-interface.py
      - scripts/ci/repair-field-groups-interface-patch.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-field-groups-interface.yml
      - scripts/ci/apply-field-groups-interface.py
      - scripts/ci/repair-field-groups-interface-patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/property-groups-searchable-select
          fetch-depth: 0
          show-progress: false
      - name: Применить изменения интерфейса
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/repair-field-groups-interface-patch.py 2>&1 | tee field-groups-interface.log
          first=${PIPESTATUS[0]}
          if [[ "$first" -eq 0 ]]; then
            python3 scripts/ci/apply-field-groups-interface.py 2>&1 | tee -a field-groups-interface.log
            second=${PIPESTATUS[0]}
          else
            second=1
          fi
          exit $(( first || second ))
      - name: Сохранить диагностику применения
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: field-groups-interface-diagnostic
          path: field-groups-interface.log
          retention-days: 3
      - name: Остановиться после ошибки применения
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Проверить интерфейс
        run: |
          node --check apps/api/ui/field-groups-ui.js
          node --check apps/api/ui/searchable-select.js
          node --check apps/api/ui/app.js
          npm ci --ignore-scripts
          npm run build
      - name: Зафиксировать изменение
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-field-groups-interface.py \
            scripts/ci/repair-field-groups-interface-patch.py \
            .github/workflows/apply-field-groups-interface.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Показать группы полей и поиск в карточках'
          git push origin HEAD:fix/property-groups-searchable-select
