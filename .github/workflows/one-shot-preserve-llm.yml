name: One-shot preserve LLM runtime

on:
  push:
    branches:
      - fix/preserve-llm-runtime-on-update

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/preserve-llm-runtime-on-update
          fetch-depth: 2

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Implement transactional LLM runtime preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > scripts/offline/preserve-llm-runtime.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          OLD_TARGET="${1:-}"
          NEW_RELEASE="${2:-}"
          RELEASES_DIR="${3:-}"

          [[ -n "$OLD_TARGET" && -n "$NEW_RELEASE" && -n "$RELEASES_DIR" ]] || exit 0
          [[ "$OLD_TARGET" == "$RELEASES_DIR/"* ]] || exit 0
          [[ -x "$OLD_TARGET/runtime/llama/llama-server" ]] || exit 0
          [[ ! -x "$NEW_RELEASE/runtime/llama/llama-server" ]] || exit 0
          [[ -d "$NEW_RELEASE/runtime" ]] || exit 0

          rm -rf -- "$NEW_RELEASE/runtime/llama"
          cp -a -- "$OLD_TARGET/runtime/llama" "$NEW_RELEASE/runtime/llama"
          printf 'preserved\n'
          EOF
          chmod 0755 scripts/offline/preserve-llm-runtime.sh

          cat > scripts/offline/preserve-llm-runtime.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { chmod, mkdir, mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import test from "node:test";
          import { fileURLToPath } from "node:url";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "../..");
          const helper = path.join(root, "scripts/offline/preserve-llm-runtime.sh");

          async function fixture() {
            const temp = await mkdtemp(path.join(os.tmpdir(), "docomator-llm-preserve-"));
            const releases = path.join(temp, "releases");
            const oldRelease = path.join(releases, "0.6.2");
            const newRelease = path.join(releases, "0.6.3");
            await mkdir(path.join(oldRelease, "runtime/llama"), { recursive: true });
            await mkdir(path.join(newRelease, "runtime/llama"), { recursive: true });
            const oldServer = path.join(oldRelease, "runtime/llama/llama-server");
            await writeFile(oldServer, "old-runtime\n", "utf8");
            await chmod(oldServer, 0o755);
            return { temp, releases, oldRelease, newRelease };
          }

          test("app-only upgrade preserves trusted llama runtime", async (t) => {
            const f = await fixture();
            t.after(() => rm(f.temp, { recursive: true, force: true }));
            const output = execFileSync("bash", [helper, f.oldRelease, f.newRelease, f.releases], { encoding: "utf8" });
            assert.equal(output.trim(), "preserved");
            assert.equal(await readFile(path.join(f.newRelease, "runtime/llama/llama-server"), "utf8"), "old-runtime\n");
          });

          test("bundle-provided llama runtime has priority", async (t) => {
            const f = await fixture();
            t.after(() => rm(f.temp, { recursive: true, force: true }));
            const server = path.join(f.newRelease, "runtime/llama/llama-server");
            await writeFile(server, "new-runtime\n", "utf8");
            await chmod(server, 0o755);
            const output = execFileSync("bash", [helper, f.oldRelease, f.newRelease, f.releases], { encoding: "utf8" });
            assert.equal(output, "");
            assert.equal(await readFile(server, "utf8"), "new-runtime\n");
          });

          test("runtime outside managed releases is never copied", async (t) => {
            const f = await fixture();
            t.after(() => rm(f.temp, { recursive: true, force: true }));
            const outside = path.join(f.temp, "outside");
            await mkdir(path.join(outside, "runtime/llama"), { recursive: true });
            const server = path.join(outside, "runtime/llama/llama-server");
            await writeFile(server, "outside\n", "utf8");
            await chmod(server, 0o755);
            const output = execFileSync("bash", [helper, outside, f.newRelease, f.releases], { encoding: "utf8" });
            assert.equal(output, "");
            await assert.rejects(readFile(path.join(f.newRelease, "runtime/llama/llama-server"), "utf8"));
          });

          test("fresh install without previous release stays app-only", async (t) => {
            const f = await fixture();
            t.after(() => rm(f.temp, { recursive: true, force: true }));
            const output = execFileSync("bash", [helper, "", f.newRelease, f.releases], { encoding: "utf8" });
            assert.equal(output, "");
            await assert.rejects(readFile(path.join(f.newRelease, "runtime/llama/llama-server"), "utf8"));
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          install = Path("scripts/offline/install.sh")
          text = install.read_text(encoding="utf-8")
          marker = '  cp -a "$BUNDLE_ROOT/payload/runtime" "$TEMP_RELEASE/"\n'
          assert text.count(marker) == 1
          insert = marker + '''  PRESERVED_LLM_RUNTIME="$(\n    "$BUNDLE_ROOT/preserve-llm-runtime.sh" "$OLD_TARGET" "$TEMP_RELEASE" "$RELEASES_DIR"\n  )"\n  if [[ "$PRESERVED_LLM_RUNTIME" == "preserved" ]]; then\n    info "Сохраняем установленный llama runtime из предыдущего выпуска"\n  fi\n'''
          install.write_text(text.replace(marker, insert), encoding="utf-8")

          prepare = Path("scripts/offline/prepare-bundle.sh")
          text = prepare.read_text(encoding="utf-8")
          marker = 'cp "$SCRIPT_DIR/lib.sh" \\\n  "$SCRIPT_DIR/verify-bundle.sh" \\\n'
          assert text.count(marker) == 1
          replacement = 'cp "$SCRIPT_DIR/lib.sh" \\\n  "$SCRIPT_DIR/preserve-llm-runtime.sh" \\\n  "$SCRIPT_DIR/verify-bundle.sh" \\\n'
          prepare.write_text(text.replace(marker, replacement), encoding="utf-8")
          PY

          npm run version:bump -- patch

          python3 - <<'PY'
          from pathlib import Path
          notes = Path("docs/RELEASE_NOTES.md")
          text = notes.read_text(encoding="utf-8")
          marker = "Единственный машинный источник версии, статуса и канала — `RELEASE_IDENTITY.json`.\n"
          section = """

          ## 2026-08-24 — безопасное app-only обновление локального LLM (`0.6.3`)

          - При обновлении приложений bundle без GGUF/llama-server сохраняет доверенный `runtime/llama` из предыдущего versioned release, поэтому уже включённый локальный LLM не отключается.
          - Runtime из нового bundle всегда имеет приоритет; fresh install и пути вне управляемого `/opt/docomator/releases/` ничего не наследуют.
          - GGUF по-прежнему хранится в постоянном `/var/lib/docomator/models` и не копируется в каждый Project Control update.
          - Добавлен regression test четырёх сценариев наследования runtime; native verify/backup/migration/atomic switch/rollback остаются обязательными.
          """
          assert marker in text
          notes.write_text(text.replace(marker, marker + section, 1), encoding="utf-8")
          PY

      - name: Commit generated release sync
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/offline/install.sh scripts/offline/prepare-bundle.sh \
            scripts/offline/preserve-llm-runtime.sh scripts/offline/preserve-llm-runtime.test.mjs \
            RELEASE_IDENTITY.json VERSION package.json package-lock.json \
            apps/api/package.json apps/worker/package.json \
            packages/config/package.json packages/contracts/package.json \
            packages/document-intake/package.json packages/storage/package.json packages/template-compiler/package.json \
            packages/config/src/index.ts config/docomator.env.example \
            docs/RELEASE_NOTES.md SECURITY.md docs/SUPPORT_MATRIX.md docs/FINALIZATION.md \
            docs/ROADMAP.md docs/NEXT_ITERATIONS.md
          git commit -m "fix(update): preserve local LLM runtime in 0.6.3"
          git push origin HEAD:fix/preserve-llm-runtime-on-update
