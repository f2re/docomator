name: One-shot preserve LLM runtime

on:
  push:
    branches:
      - fix/preserve-llm-runtime-064
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/preserve-llm-runtime-064
          fetch-depth: 2
      - id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Implement, test and bump
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > scripts/offline/preserve-llm-runtime.sh <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          OLD_TARGET="${1:-}"
          NEW_RELEASE="${2:-}"
          RELEASES_DIR="${3:-}"
          [[ -n "$OLD_TARGET" && -n "$NEW_RELEASE" && -n "$RELEASES_DIR" ]] || exit 0
          [[ "$OLD_TARGET" == "$RELEASES_DIR/"* ]] || exit 0
          [[ -x "$OLD_TARGET/runtime/llama/llama-server" ]] || exit 0
          [[ ! -x "$NEW_RELEASE/runtime/llama/llama-server" ]] || exit 0
          [[ -d "$NEW_RELEASE/runtime" ]] || exit 0
          rm -rf -- "$NEW_RELEASE/runtime/llama"
          cp -a -- "$OLD_TARGET/runtime/llama" "$NEW_RELEASE/runtime/llama"
          printf 'preserved\n'
          EOF
          chmod 0755 scripts/offline/preserve-llm-runtime.sh

          cat > scripts/offline/preserve-llm-runtime.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { chmod, mkdir, mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import test from "node:test";
          import { fileURLToPath } from "node:url";
          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "../..");
          const helper = path.join(root, "scripts/offline/preserve-llm-runtime.sh");
          async function fixture() {
            const temp = await mkdtemp(path.join(os.tmpdir(), "docomator-llm-preserve-"));
            const releases = path.join(temp, "releases");
            const oldRelease = path.join(releases, "old");
            const newRelease = path.join(releases, "new");
            await mkdir(path.join(oldRelease, "runtime/llama"), { recursive: true });
            await mkdir(path.join(newRelease, "runtime/llama"), { recursive: true });
            const oldServer = path.join(oldRelease, "runtime/llama/llama-server");
            await writeFile(oldServer, "old-runtime\n");
            await chmod(oldServer, 0o755);
            return { temp, releases, oldRelease, newRelease };
          }
          test("app-only upgrade preserves trusted llama runtime", async (t) => {
            const f = await fixture(); t.after(() => rm(f.temp, { recursive: true, force: true }));
            assert.equal(execFileSync("bash", [helper, f.oldRelease, f.newRelease, f.releases], { encoding: "utf8" }).trim(), "preserved");
            assert.equal(await readFile(path.join(f.newRelease, "runtime/llama/llama-server"), "utf8"), "old-runtime\n");
          });
          test("bundle runtime has priority", async (t) => {
            const f = await fixture(); t.after(() => rm(f.temp, { recursive: true, force: true }));
            const server = path.join(f.newRelease, "runtime/llama/llama-server"); await writeFile(server, "new-runtime\n"); await chmod(server, 0o755);
            assert.equal(execFileSync("bash", [helper, f.oldRelease, f.newRelease, f.releases], { encoding: "utf8" }), "");
            assert.equal(await readFile(server, "utf8"), "new-runtime\n");
          });
          test("outside managed releases is rejected", async (t) => {
            const f = await fixture(); t.after(() => rm(f.temp, { recursive: true, force: true }));
            const outside = path.join(f.temp, "outside"); await mkdir(path.join(outside, "runtime/llama"), { recursive: true });
            const server = path.join(outside, "runtime/llama/llama-server"); await writeFile(server, "outside\n"); await chmod(server, 0o755);
            assert.equal(execFileSync("bash", [helper, outside, f.newRelease, f.releases], { encoding: "utf8" }), "");
            await assert.rejects(readFile(path.join(f.newRelease, "runtime/llama/llama-server")));
          });
          test("fresh install inherits nothing", async (t) => {
            const f = await fixture(); t.after(() => rm(f.temp, { recursive: true, force: true }));
            assert.equal(execFileSync("bash", [helper, "", f.newRelease, f.releases], { encoding: "utf8" }), "");
            await assert.rejects(readFile(path.join(f.newRelease, "runtime/llama/llama-server")));
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/offline/install.sh'); s=p.read_text(); m='  cp -a "$BUNDLE_ROOT/payload/runtime" "$TEMP_RELEASE/"\n'; assert s.count(m)==1
          s=s.replace(m,m+'  PRESERVED_LLM_RUNTIME="$(\n    "$BUNDLE_ROOT/preserve-llm-runtime.sh" "$OLD_TARGET" "$TEMP_RELEASE" "$RELEASES_DIR"\n  )"\n  if [[ "$PRESERVED_LLM_RUNTIME" == "preserved" ]]; then\n    info "Сохраняем установленный llama runtime из предыдущего выпуска"\n  fi\n'); p.write_text(s)
          p=Path('scripts/offline/prepare-bundle.sh'); s=p.read_text(); m='cp "$SCRIPT_DIR/lib.sh" \\\n  "$SCRIPT_DIR/verify-bundle.sh" \\\n'; assert s.count(m)==1
          p.write_text(s.replace(m,'cp "$SCRIPT_DIR/lib.sh" \\\n  "$SCRIPT_DIR/preserve-llm-runtime.sh" \\\n  "$SCRIPT_DIR/verify-bundle.sh" \\\n'))
          PY
          npm run version:bump -- patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/RELEASE_NOTES.md'); s=p.read_text(); m='Единственный машинный источник версии, статуса и канала — `RELEASE_IDENTITY.json`.\n'; assert m in s
          x='\n\n## 2026-08-24 — безопасное app-only обновление локального LLM (`0.6.4`)\n\n- Bundle без GGUF/llama-server сохраняет доверенный `runtime/llama` предыдущего managed release; новый runtime всегда имеет приоритет.\n- Fresh install и пути вне `/opt/docomator/releases/` ничего не наследуют; GGUF остаётся в постоянном `/var/lib/docomator/models`.\n- Добавлены functional regression tests; verify/backup/migration/atomic switch/rollback не ослабляются.\n'
          p.write_text(s.replace(m,m+x,1))
          PY
      - name: Commit generated release sync
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/one-shot-preserve-llm.yml'
          git commit -m "fix(update): preserve local LLM runtime in 0.6.4"
          git push origin HEAD:fix/preserve-llm-runtime-064
