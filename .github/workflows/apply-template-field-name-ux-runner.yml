name: Финализировать исправление полей шаблона

on:
  pull_request_target:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/template-field-name-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: fix/template-field-name-ux
          fetch-depth: 0
          show-progress: false

      - name: Исправить контракт ожидаемой ошибки и удалить диагностику
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/template-draft-routes.test.ts')
          source = path.read_text(encoding='utf-8')
          old = '''        personName: {
          sourceOrder: "family-given-patronymic",
          pattern: "{Неизвестно}"
        }
      }
    });
    assert.equal(invalid.statusCode, 400, invalid.body);'''
          new = '''        personName: {
          sourceOrder: "family-given-patronymic",
          pattern: "{Неизвестно}"
        }
      }
    });
    assert.equal(invalid.statusCode, 422, invalid.body);'''
          if source.count(old) != 1:
              raise SystemExit('Не найден точный тест недопустимого шаблона ФИО')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f \
            .apply-template-field-name-ux \
            .finalize-template-field-name-ux \
            .template-field-name-ux.check.log \
            .template-field-name-ux.error.log \
            .template-field-name-ux.py \
            .template-field-name-ux.py.gz.b64 \
            .github/workflows/apply-template-field-name-ux.yml \
            .github/workflows/finalize-template-field-name-ux-branch.yml
          git show 6a90b71ca25dface072d6c6972c65e16aa5ecf3d:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check

      - name: Определить версию Node.js
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Установить зафиксированные зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Проверить весь репозиторий
        run: npm run check

      - name: Проверить миграции на чистой базе
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-template-field-name-ux-final
        run: npm run migrate

      - name: Зафиксировать проверенные изменения
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'finalize template field name formats and empty placement'
          git push origin HEAD:fix/template-field-name-ux
