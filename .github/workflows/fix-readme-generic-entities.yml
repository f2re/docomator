name: Исправить документацию произвольных объектов

on:
  push:
    branches:
      - fix/readme-generic-entities
    paths:
      - scripts/ci/fix-readme-generic-entities.py
      - .github/workflows/fix-readme-generic-entities.yml

permissions:
  contents: write

concurrency:
  group: fix-readme-generic-entities
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-generic-entities
          fetch-depth: 0
      - name: Применить правки
        run: python3 scripts/ci/fix-readme-generic-entities.py
      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить документацию и терминологию
        run: |
          npm run check:docs
          npm run check:language
      - name: Зафиксировать итог
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/fix-readme-generic-entities.py \
            .github/workflows/fix-readme-generic-entities.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Актуализировать порядок работы и необязательный PDF'
          git push origin HEAD:fix/readme-generic-entities
