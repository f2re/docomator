name: Исправить браузерные регрессии интерфейса

on:
  push:
    branches:
      - feature/interface-hierarchy
    paths:
      - .github/workflows/fix-interface-browser-regressions.yml
      - scripts/ci/fix-interface-browser-regressions.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interface-hierarchy
          fetch-depth: 0
          show-progress: false
      - run: python3 scripts/ci/fix-interface-browser-regressions.py
      - run: node --check apps/api/ui/interface-hierarchy.js && node --check apps/api/ui/template-row-editor-v2.js
      - shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/fix-interface-browser-regressions.py \
            .github/workflows/fix-interface-browser-regressions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Исправить браузерные регрессии интерфейса'
          git push origin HEAD:feature/interface-hierarchy
