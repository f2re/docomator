name: Добавить группы полей справочника

on:
  push:
    branches:
      - fix/property-groups-searchable-select
    paths:
      - .github/workflows/apply-property-field-groups-backend.yml
      - scripts/ci/apply-property-field-groups-backend.py
      - scripts/ci/repair-property-field-groups-backend-patch.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-property-field-groups-backend.yml
      - scripts/ci/apply-property-field-groups-backend.py
      - scripts/ci/repair-property-field-groups-backend-patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/property-groups-searchable-select
          fetch-depth: 0
          show-progress: false
      - name: Применить серверные изменения
        run: |
          python3 scripts/ci/repair-property-field-groups-backend-patch.py
          python3 scripts/ci/apply-property-field-groups-backend.py
      - name: Проверить TypeScript
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Зафиксировать изменение
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-property-field-groups-backend.py \
            scripts/ci/repair-property-field-groups-backend-patch.py \
            .github/workflows/apply-property-field-groups-backend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Разделить свойства преподавателей и студентов'
          git push origin HEAD:fix/property-groups-searchable-select
