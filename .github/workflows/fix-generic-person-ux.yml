name: Исправить интерфейс людей в универсальном редакторе

on:
  push:
    branches:
      - feature/generic-entities-offline-audit
    paths:
      - scripts/ci/fix-generic-person-ux.py
      - .github/workflows/fix-generic-person-ux.yml

permissions:
  contents: write

concurrency:
  group: fix-generic-person-ux
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-entities-offline-audit
          fetch-depth: 0
      - name: Применить исправление
        run: python3 scripts/ci/fix-generic-person-ux.py
      - name: Проверить синтаксис
        run: node --check apps/api/ui/template-row-editor-v2.js
      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить репозиторий
        run: npm run check
      - name: Зафиксировать исправление
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/ci/fix-generic-person-ux.py .github/workflows/fix-generic-person-ux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Сохранить интерфейс людей в универсальном редакторе'
          git push origin HEAD:feature/generic-entities-offline-audit
