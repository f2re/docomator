name: Interface art-direction audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: interface-art-direction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Docomator
        uses: actions/checkout@v4

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and prepare database
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-art-direction-data
        run: |
          npm run build
          npm run migrate

      - name: Start local application
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-art-direction-data
          DOCOMATOR_PORT: 18080
          DOCOMATOR_PREVIEW_ENABLED: "false"
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run start:api > "$RUNNER_TEMP/docomator-art-direction-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/docomator-art-direction-api.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/docomator-art-direction-api.log"
          exit 1

      - name: Fetch pinned Better Art Direction
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/f2re/better-art-direction.git "$RUNNER_TEMP/better-art-direction"
          git -C "$RUNNER_TEMP/better-art-direction" checkout cc455537eaac951cffa67a052c686431756559e7

      - name: Run static audit
        shell: bash
        run: |
          mkdir -p art-direction-audit
          node "$RUNNER_TEMP/better-art-direction/skills/better-art-direction/scripts/static-audit.mjs" \
            apps/api/ui \
            --format markdown \
            --out art-direction-audit/static-report.md \
            --no-fail
          node "$RUNNER_TEMP/better-art-direction/skills/better-art-direction/scripts/static-audit.mjs" \
            apps/api/ui \
            --format json \
            --out art-direction-audit/static-report.json \
            --no-fail

      - name: Run rendered audit
        shell: bash
        run: |
          node "$RUNNER_TEMP/better-art-direction/skills/better-art-direction/scripts/visual-audit.mjs" \
            --url http://127.0.0.1:18080 \
            --paths '/#overview,/#employees,/#templates,/#generation,/#documents,/#settings' \
            --widths 320,768,1440 \
            --schemes light,dark \
            --height 900 \
            --out art-direction-audit/rendered \
            --format markdown \
            --no-axe \
            --no-fail

      - name: Prepare fail-closed remediation sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          def replace_exact(relative, old, new, expected=1):
              path = Path(relative)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{relative}: ожидалось вхождений {expected}, найдено {count}: {old[:100]!r}"
                  )
              path.write_text(source.replace(old, new), encoding="utf-8")

          replace_exact(
              "apps/api/ui/help-center.css",
              "  outline: none;\n",
              "",
          )
          replace_exact(
              "apps/api/ui/help-project-documents.css",
              "  outline: none;\n",
              "",
              expected=2,
          )
          replace_exact(
              "apps/api/ui/styles.css",
              ".search-field input { width: 100%; color: var(--text); background: transparent; border: 0; outline: 0; }",
              ".search-field input { width: 100%; color: var(--text); background: transparent; border: 0; }",
          )

          test_path = Path("tests/e2e/art-direction.spec.mjs")
          test_source = test_path.read_text(encoding="utf-8")
          old_test = '''test("видимый фокус сохраняется на основной навигации", async ({ page }) => {
            await openMockedWorkspace(page);
            const employees = page.locator('.nav-item[data-view-target="employees"]');
            await employees.focus();
            const outline = await employees.evaluate((element) => {
              const style = getComputedStyle(element);
              return {
                style: style.outlineStyle,
                width: parseFloat(style.outlineWidth)
              };
            });
            expect(outline.style).not.toBe("none");
            expect(outline.width).toBeGreaterThanOrEqual(2);
          });'''
          new_test = '''test("видимый фокус сохраняется на основной навигации", async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await openMockedWorkspace(page);
            const employees = page.locator('.nav-item[data-view-target="employees"]');
            await page.keyboard.press("Tab");
            await employees.focus();
            const outline = await employees.evaluate((element) => {
              const style = getComputedStyle(element);
              return {
                style: style.outlineStyle,
                width: parseFloat(style.outlineWidth)
              };
            });
            expect(outline.style).not.toBe("none");
            expect(outline.width).toBeGreaterThanOrEqual(2);
          });'''
          if test_source.count(old_test) != 1:
              raise SystemExit("tests/e2e/art-direction.spec.mjs: не найден точный тест фокуса")
          test_path.write_text(test_source.replace(old_test, new_test), encoding="utf-8")

          css_path = Path("apps/api/ui/template-row-flow.css")
          css_source = css_path.read_text(encoding="utf-8").rstrip()
          marker = "/* Коррекции, подтверждённые полным Chromium/axe-прогоном. */"
          if marker in css_source:
              raise SystemExit("apps/api/ui/template-row-flow.css: блок коррекций уже существует")
          css_source += '''

          /* Коррекции, подтверждённые полным Chromium/axe-прогоном. */
          .primary-button,
          .secondary-button {
            min-height: 44px;
          }

          .employee-row-status.is-active {
            color: #1f5f45;
            background: #e4eee8;
          }

          :root[data-theme="dark"] .employee-row-status.is-active {
            color: #9fe2bc;
            background: rgba(112, 207, 158, 0.14);
          }

          @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .employee-row-status.is-active {
              color: #9fe2bc;
              background: rgba(112, 207, 158, 0.14);
            }
          }

          .nav-item:focus,
          .mobile-nav button:focus {
            outline: 3px solid var(--accent-strong);
            outline-offset: 2px;
          }

          .home-hero .hero-copy {
            align-items: stretch;
          }

          .home-hero .hero-copy > * {
            min-width: 0;
            max-width: 100%;
          }

          .home-hero .hero-copy h2,
          .home-hero .hero-copy p,
          .home-hero .hero-copy .primary-button {
            overflow-wrap: anywhere;
            text-wrap: wrap;
          }

          .home-hero .hero-copy .primary-button {
            align-self: flex-start;
            white-space: normal;
          }

          @media (max-width: 820px) {
            .topbar-actions {
              justify-content: flex-start;
            }

            .topbar-actions .workspace-switcher-host {
              width: auto;
              max-width: none !important;
              flex: 1 1 0;
            }

            .topbar .context-chip {
              width: 100%;
              max-width: none !important;
            }

            .settings-row.management-tile {
              display: grid;
              min-height: 0;
              grid-template-columns: 36px minmax(0, 1fr) 16px;
              align-items: start;
              gap: 10px;
              padding: 14px;
            }

            .management-tile-icon {
              width: 36px;
              height: 36px;
              align-self: start;
              border-radius: 5px;
            }

            .management-tile-copy {
              min-width: 0;
            }

            .management-tile-copy strong,
            .management-tile-copy small,
            .management-tile-copy em {
              max-width: 100%;
              overflow-wrap: anywhere;
            }

            .management-chevron {
              align-self: center;
            }
          }

          @media (max-width: 620px) {
            .management-tile-copy em {
              display: none;
            }
          }
          '''
          css_path.write_text(css_source.strip() + "\n", encoding="utf-8")

          destinations = [
              "apps/api/ui/help-center.css",
              "apps/api/ui/help-project-documents.css",
              "apps/api/ui/styles.css",
              "apps/api/ui/template-row-flow.css",
              "tests/e2e/art-direction.spec.mjs",
          ]
          root = Path("art-direction-remediation")
          for relative in destinations:
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(relative, target)
          PY
          git diff --check
          node --check tests/e2e/art-direction.spec.mjs

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: interface-art-direction-audit
          path: |
            art-direction-audit
            ${{ runner.temp }}/docomator-art-direction-api.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload remediation sources
        uses: actions/upload-artifact@v4
        with:
          name: interface-art-direction-remediation
          path: art-direction-remediation
          if-no-files-found: error
          retention-days: 3
