name: Разделить поля в шаблонах

on:
  push:
    branches:
      - fix/property-groups-searchable-select
    paths:
      - .github/workflows/apply-template-field-groups.yml
      - scripts/ci/apply-template-field-groups.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-template-field-groups.yml
      - scripts/ci/apply-template-field-groups.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/property-groups-searchable-select
          fetch-depth: 0
          show-progress: false
      - name: Применить разделение полей
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/apply-template-field-groups.py 2>&1 | tee template-field-groups.log
          exit ${PIPESTATUS[0]}
      - name: Сохранить диагностику
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: template-field-groups-diagnostic
          path: template-field-groups.log
          retention-days: 3
      - name: Остановиться после ошибки применения
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Проверить интерфейс
        run: |
          node --check apps/api/ui/document-structure.js
          node --check apps/api/ui/template-row-editor-v2.js
          npm ci --ignore-scripts
          npm run build
      - name: Зафиксировать изменение
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-template-field-groups.py \
            .github/workflows/apply-template-field-groups.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Разделить поля преподавателей и студентов в шаблонах'
          git push origin HEAD:fix/property-groups-searchable-select
