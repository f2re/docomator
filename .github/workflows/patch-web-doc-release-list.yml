name: Согласовать автономную проверку документации

on:
  push:
    branches:
      - feature/complete-web-documentation
    paths:
      - .github/workflows/patch-web-doc-release-list.yml
      - scripts/ci/patch-web-doc-release-list.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-web-documentation
          fetch-depth: 0
          show-progress: false
      - name: Применить изменение
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/patch-web-doc-release-list.py
          rm -f \
            scripts/ci/patch-web-doc-release-list.py \
            .github/workflows/patch-web-doc-release-list.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'test include documentation flow in offline acceptance'
          git push origin HEAD:feature/complete-web-documentation
