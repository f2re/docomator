name: Temporary access-code version bump

on:
  push:
    branches:
      - refactor/access-code-cleanup

permissions:
  contents: write

concurrency:
  group: tmp-access-code-version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Generate patch release metadata
        run: node scripts/release/bump-version.mjs patch

      - name: Verify generated lockfile
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("package-lock.json", "utf8"))'
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --check

      - name: Commit generated release files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_IDENTITY.json VERSION package.json package-lock.json \
            apps/api/package.json apps/worker/package.json \
            packages/config/package.json packages/contracts/package.json \
            packages/document-intake/package.json packages/storage/package.json \
            packages/template-compiler/package.json packages/config/src/index.ts \
            config/docomator.env.example docs/RELEASE_NOTES.md docs/ROADMAP.md \
            docs/FINALIZATION.md docs/SUPPORT_MATRIX.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(release): bump access-code refactor version'
          git push origin HEAD:refactor/access-code-cleanup
