name: Apply Oformlyator brand system

on:
  push:
    branches:
      - design/oformlyator-brand-system

permissions:
  contents: write

jobs:
  apply-brand-system:
    if: github.event.head_commit.message != 'chore: apply brand system [brand-system-applied]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply brand system
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/apply-brand-system.py
          node --check scripts/ci/check-branding.mjs
          node scripts/ci/check-branding.mjs
          git diff --check
      - name: Commit transformed tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Brand system already applied."
            exit 0
          fi
          git commit -m "chore: apply brand system [brand-system-applied]"
          git push origin HEAD:design/oformlyator-brand-system
