name: Run first-run password bootstrap implementation

on:
  push:
    branches:
      - fix/first-run-password-bootstrap

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "feat(auth): add first-run password bootstrap [bootstrap-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply implementation
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-first-run-password-bootstrap.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n\n          npm run version:bump -- minor", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-first-run.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-first-run.py
          npm run version:bump -- minor
          python3 - <<'PY'
          from pathlib import Path
          notes = Path('docs/RELEASE_NOTES.md')
          text = notes.read_text(encoding='utf-8')
          marker = '## 2026-08-11 — бренд-система «Документный рабочий стол»\n'
          section = '\n'.join([
            '## 2026-08-11 — первичная настройка общего пароля в браузере',
            '',
            '- Устранён блокирующий дефект offline first-run: интерфейс и `first-run.sh` ссылались на отсутствующий `scripts/offline/set-password.sh`, а installer не создавал session secret.',
            '- Новая установка теперь сама генерирует уникальный session secret; ручное редактирование `/etc/docomator/docomator.env` для первого запуска не требуется.',
            '- Пока пароль отсутствует, `/login` показывает одноразовый экран **«Первый запуск»** с вводом и подтверждением общего пароля. После сохранения оператор автоматически получает сессию и переходит в рабочий интерфейс.',
            '- Хэш общего пароля записывается атомарно в SQLite; одновременная вторая настройка не может перезаписать первый пароль. Пароль открытым текстом не сохраняется.',
            '- После инициализации bootstrap endpoint закрыт; модель остаётся общей для доверенного контура без пользователей, ролей и ACL.',
            '- В offline bundle возвращён реальный `set-password.sh` как headless fallback; он вызывает тот же локальный bootstrap API.',
            '- Версия повышена как новая обратно совместимая возможность первого запуска: `0.2.1 → 0.3.0`; статус остаётся `candidate / pilot`.',
            '',
            ''
          ])
          if text.count(marker) != 1:
              raise SystemExit('release notes insertion marker not found')
          notes.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY
          chmod 0755 scripts/offline/set-password.sh scripts/offline/set-password.mjs
          bash -n scripts/offline/set-password.sh scripts/offline/first-run.sh scripts/offline/install.sh scripts/offline/prepare-bundle.sh
          node --check scripts/offline/set-password.mjs scripts/offline/password-bootstrap.test.mjs
          npm ci
          npm run build -w @docomator/api
          npm run test -w @docomator/api
          node --test scripts/offline/password-bootstrap.test.mjs
          npm run check:migrations
          npm run check:release-version
          npm run check:language
          git diff --check
      - name: Commit implementation
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(auth): add first-run password bootstrap [bootstrap-applied]"
          git push origin HEAD:fix/first-run-password-bootstrap
