name: Применить поддержку произвольных сущностей

on:
  push:
    branches:
      - feature/generic-entities-offline-audit
    paths:
      - scripts/ci/apply-generic-entities-backend.py
      - .github/workflows/apply-generic-entities-backend.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/ci/apply-generic-entities-backend.py
      - .github/workflows/apply-generic-entities-backend.yml

permissions:
  contents: write

concurrency:
  group: apply-generic-entities-backend
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-entities-offline-audit
          fetch-depth: 0
      - name: Применить изменения
        run: python3 scripts/ci/apply-generic-entities-backend.py
      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить репозиторий
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee generic-entities-check.log
      - name: Сохранить журнал ошибки
        if: steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generic-entities-check-log
          path: generic-entities-check.log
          retention-days: 3
      - name: Остановиться после ошибки
        if: steps.check.outcome == 'failure'
        run: exit 1
      - name: Зафиксировать изменения
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/ci/apply-generic-entities-backend.py .github/workflows/apply-generic-entities-backend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Поддержать импорт и группы произвольных сущностей'
          git push origin HEAD:feature/generic-entities-offline-audit
