name: Prepare visual contract version artifact

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/visual-interface-contract-20260818

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Generate exact 0.5.2 release metadata
        run: node scripts/release/bump-version.mjs 0.5.2

      - name: Upload transformed files
        uses: actions/upload-artifact@v4
        with:
          name: visual-contract-version-0.5.2
          if-no-files-found: error
          retention-days: 1
          path: |
            RELEASE_IDENTITY.json
            VERSION
            package.json
            package-lock.json
            apps/api/package.json
            apps/worker/package.json
            packages/config/package.json
            packages/config/src/index.ts
            packages/contracts/package.json
            packages/document-intake/package.json
            packages/storage/package.json
            packages/template-compiler/package.json
            config/docomator.env.example
            docs/RELEASE_NOTES.md
            SECURITY.md
            docs/SUPPORT_MATRIX.md
            docs/FINALIZATION.md
            docs/ROADMAP.md
            docs/NEXT_ITERATIONS.md
