name: Уточнить выбор групп в строке

on:
  push:
    branches:
      - fix/property-groups-searchable-select
    paths:
      - .github/workflows/refine-template-field-groups.yml
      - scripts/ci/refine-template-field-groups.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/property-groups-searchable-select
          fetch-depth: 0
      - run: python3 scripts/ci/refine-template-field-groups.py
      - run: node --check apps/api/ui/template-row-editor-v2.js
      - shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/ci/refine-template-field-groups.py .github/workflows/refine-template-field-groups.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Уточнить переключение групп полей строки'
          git push origin HEAD:fix/property-groups-searchable-select
