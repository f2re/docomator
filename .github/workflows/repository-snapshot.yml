name: Apply verified release consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-release-consolidation-agent-release-0-1-0-rc1
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'f2re/docomator' &&
      github.head_ref == 'agent/release-0.1.0-rc1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/release-0.1.0-rc1

      - name: Verify payload and apply canonical release tree
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly EXPECTED_PARENT='b8b1ab8465882c3da6611e216c8fcd9de7103b94'
          readonly BASE64_SHA256='ee7933ce09d86aa6f51761ceb42139291c10d5b930f3a81aa88cd3774a5ea888'
          readonly ZSTD_SHA256='5690cda4b257a82dc9df76240043d3442c195c038d0341a8670c38caf5ae2167'
          readonly PATCH_SHA256='b1ddb466344bdfb6df431d36ace9c859c7740d7098cc68ef15e95f3d99690d0f'
          readonly PAYLOAD_DIR='.github/release-consolidation-payload'
          readonly WORKFLOW_FILE='.github/workflows/repository-snapshot.yml'
          readonly BASE64_FILE="$RUNNER_TEMP/release-consolidation.patch.zst.b64"
          readonly ZSTD_FILE="$RUNNER_TEMP/release-consolidation.patch.zst"
          readonly PATCH_FILE="$RUNNER_TEMP/release-consolidation.patch"

          test "$GITHUB_HEAD_REF" = 'agent/release-0.1.0-rc1'
          test "$(git branch --show-current)" = 'agent/release-0.1.0-rc1'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          command -v base64 >/dev/null
          command -v sha256sum >/dev/null
          command -v zstd >/dev/null

          mapfile -t payload_parts < <(find "$PAYLOAD_DIR" -maxdepth 1 -type f -name 'part-*' -print | LC_ALL=C sort)
          test "${#payload_parts[@]}" -eq 7
          cat "${payload_parts[@]}" > "$BASE64_FILE"
          printf '%s  %s\n' "$BASE64_SHA256" "$BASE64_FILE" | sha256sum --check --strict
          base64 --decode "$BASE64_FILE" > "$ZSTD_FILE"
          printf '%s  %s\n' "$ZSTD_SHA256" "$ZSTD_FILE" | sha256sum --check --strict
          zstd --decompress --stdout "$ZSTD_FILE" > "$PATCH_FILE"
          printf '%s  %s\n' "$PATCH_SHA256" "$PATCH_FILE" | sha256sum --check --strict

          git apply --check "$PATCH_FILE"
          git apply --index "$PATCH_FILE"
          rm -rf "$PAYLOAD_DIR"
          rm -f "$WORKFLOW_FILE"
          git add -A
          git diff --cached --check

          node scripts/ci/check-canonical-ui.mjs
          node scripts/ci/check-release-version.mjs
          node scripts/ci/check-workflow-permissions.mjs
          node scripts/ci/check-audit-remediation.mjs
          npm run check:docs
          npm run check:ui
          npm run check:language

          test ! -e "$PAYLOAD_DIR"
          test ! -e "$WORKFLOW_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Сконсолидировать UI и подготовить 0.1.0-rc.1'
          git push origin HEAD:refs/heads/agent/release-0.1.0-rc1
