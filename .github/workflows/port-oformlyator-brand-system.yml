name: Port Oformlyator brand system

on:
  push:
    branches:
      - design/oformlyator-brand-system-v2

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current main-based branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "feat(ui): apply Oformlyator brand system 0.2.1 [brand-port-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Port verified brand implementation
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin design/oformlyator-brand-system
          git checkout origin/design/oformlyator-brand-system -- \
            apps/api/src/password-gate.ts \
            apps/api/src/ui-routes.ts \
            apps/api/ui/AGENTS.md \
            apps/api/ui/brand-tokens.css \
            apps/api/ui/favicon.svg \
            apps/api/ui/index.html \
            apps/api/ui/interface-hierarchy.css \
            apps/api/ui/interface-stability.css \
            apps/api/ui/styles.css \
            docs/BRANDING.md \
            docs/BRAND_DESIGN_STUDY.md \
            docs/INTERFACE_HIERARCHY.md \
            docs/UX_UI_SPECIFICATION.md \
            scripts/ci/check-branding.mjs

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs_index = Path('docs/README.md')
          replace_once(
              docs_index,
              '| [BRANDING.md](BRANDING.md) | пользовательское название продукта и неизменяемые технические идентификаторы совместимости |',
              '| [BRANDING.md](BRANDING.md) | нормативная бренд-система: знак, палитра, типографика, spacing, геометрия, состояния и правила UI |\n| [BRAND_DESIGN_STUDY.md](BRAND_DESIGN_STUDY.md) | три исследованных визуальных направления и обоснование выбранного варианта |',
          )

          architecture = Path('docs/ARCHITECTURE.md')
          replace_once(
              architecture,
              '- использует единую систему design tokens и state components;',
              '- использует единый визуальный token source `apps/api/ui/brand-tokens.css`; нормативные значения закреплены в `docs/BRANDING.md`;',
          )

          roadmap = Path('docs/ROADMAP.md')
          replace_once(
              roadmap,
              '- канонический единый UI без параллельных поколений экранов;',
              '- канонический единый UI без параллельных поколений экранов;\n- бренд-система «Документный рабочий стол» сведена к одному visual token source; старые конкурирующие палитры, blur/gradient-декор и скрытая hero-иллюстрация удалены;',
          )
          PY

          npm run version:bump -- patch

          python3 - <<'PY'
          from pathlib import Path
          notes = Path('docs/RELEASE_NOTES.md')
          text = notes.read_text(encoding='utf-8')
          marker = '## 2026-08-11 — продуктовая линия 0.2.0 и SemVer\n'
          section_lines = [
              '## 2026-08-11 — бренд-система «Документный рабочий стол»',
              '',
              '- Разработаны и сравнены три визуальных направления: «Документный рабочий стол», «Строгий реестр» и «Технический чертёж»; выбран первый как наиболее предметный, спокойный и пригодный для длинных русских реестров.',
              '- Палитра, типографика, spacing `4/8/12/16/24/32/48`, радиусы `7/10/14`, semantic colors, 44 px touch targets и light/dark contract сведены в единый `apps/api/ui/brand-tokens.css` и нормативно описаны в `docs/BRANDING.md`.',
              '- Старые конкурирующие theme-блоки, glass/blur, сине-фиолетовые градиенты, декоративная hero-иллюстрация и жёстко заданные синие тени удалены из рабочего UI; экран входа и favicon приведены к той же системе.',
              '- На узких экранах controls больше не ужимаются до 36–40 px: минимальная интерактивная зона 44 × 44 px закреплена как regression requirement.',
              '- `check:branding` теперь контролирует не только имя продукта, но и visual token source, ключевые surfaces, touch targets и отсутствие возврата устаревших эффектов.',
              '- Версия повышена как обратно совместимый UI/regression patch: `0.2.0 → 0.2.1`; статус выпуска остаётся `candidate / pilot`.',
              '',
              '',
          ]
          section = '\n'.join(section_lines)
          if text.count(marker) != 1:
              raise SystemExit('release notes insertion marker not found exactly once')
          notes.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY

          node --check scripts/ci/check-branding.mjs
          npm run check:branding
          git diff --check
      - name: Commit ported product tree
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ui): apply Oformlyator brand system 0.2.1 [brand-port-applied]"
          git push origin HEAD:design/oformlyator-brand-system-v2
