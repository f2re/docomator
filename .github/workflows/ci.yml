name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-template-field-name-ux:
    name: Finalize template field name UX
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 37 && github.head_ref == 'fix/template-field-name-ux'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/template-field-name-ux
          fetch-depth: 0
          show-progress: false

      - name: Correct expected status and clean temporary files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/template-draft-routes.test.ts')
          source = path.read_text(encoding='utf-8')
          old = '''        personName: {
          sourceOrder: "family-given-patronymic",
          pattern: "{Неизвестно}"
        }
      }
    });
    assert.equal(invalid.statusCode, 400, invalid.body);'''
          new = '''        personName: {
          sourceOrder: "family-given-patronymic",
          pattern: "{Неизвестно}"
        }
      }
    });
    assert.equal(invalid.statusCode, 422, invalid.body);'''
          if source.count(old) != 1:
              raise SystemExit('Не найден точный тест недопустимого шаблона ФИО')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f \
            .apply-template-field-name-ux \
            .finalize-template-field-name-ux \
            .template-field-name-ux.check.log \
            .template-field-name-ux.error.log \
            .template-field-name-ux.py \
            .template-field-name-ux.py.gz.b64 \
            .github/workflows/apply-template-field-name-ux.yml \
            .github/workflows/finalize-template-field-name-ux-branch.yml
          git show 6a90b71ca25dface072d6c6972c65e16aa5ecf3d:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check

      - name: Read Node.js version
        id: finalize-node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.finalize-node.outputs.version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify finalized repository
        run: npm run check

      - name: Smoke-test migration on a fresh database
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-template-field-name-ux-final
        run: npm run migrate

      - name: Commit finalized implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'finalize template field name formats and empty placement'
          git push origin HEAD:fix/template-field-name-ux

  verify:
    name: Build, test, docs, and shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repository
        id: repository_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee repository-check.log

      - name: Upload repository-check diagnostic
        if: steps.repository_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: repository-check-diagnostic
          path: repository-check.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after failed repository check
        if: steps.repository_check.outcome == 'failure'
        run: exit 1

      - name: Smoke-test migration on a fresh database
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-data
        run: npm run migrate

  browser-e2e:
    name: Chromium user flows
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Prepare browser database
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-browser-data
        run: npm run migrate

      - name: Start local application
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-browser-data
          DOCOMATOR_PORT: 18080
        shell: bash
        run: |
          npm run start:api > "$RUNNER_TEMP/docomator-browser-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/docomator-browser-api.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/docomator-browser-api.log"
          exit 1

      - name: Run Chromium user flows
        env:
          DOCOMATOR_E2E_BASE_URL: http://127.0.0.1:18080
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostic
          path: |
            tests/e2e/.tmp/playwright-report
            tests/e2e/.tmp/playwright-results
            ${{ runner.temp }}/docomator-browser-api.log
          if-no-files-found: warn
          retention-days: 3
