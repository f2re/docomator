name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, docs, and shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repository
        id: repository_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee repository-check.log

      - name: Upload repository-check diagnostic
        if: steps.repository_check.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-check-diagnostic
          path: repository-check.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after failed repository check
        if: steps.repository_check.outcome == 'failure'
        run: exit 1

      - name: Smoke-test migration on a fresh database
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-data
        run: npm run migrate

  browser-e2e:
    name: Chromium user flows
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Prepare browser database
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-browser-data
        run: npm run migrate

      - name: Start local application and worker
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-browser-data
          DOCOMATOR_PORT: 18080
          DOCOMATOR_PREVIEW_ENABLED: "false"
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run start:api > "$RUNNER_TEMP/docomator-browser-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/docomator-browser-api.pid"
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/readyz > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat "$RUNNER_TEMP/docomator-browser-api.log"
            exit 1
          fi
          npm run start:worker > "$RUNNER_TEMP/docomator-browser-worker.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/docomator-browser-worker.pid"
          sleep 1
          if ! kill -0 "$(cat "$RUNNER_TEMP/docomator-browser-worker.pid")" 2>/dev/null; then
            cat "$RUNNER_TEMP/docomator-browser-worker.log"
            exit 1
          fi

      - name: Run Chromium user flows
        env:
          DOCOMATOR_E2E_BASE_URL: http://127.0.0.1:18080
        run: npm run test:e2e

      - name: Run real-stack Chromium smoke
        env:
          DOCOMATOR_E2E_BASE_URL: http://127.0.0.1:18080
        run: npm run test:e2e:real-stack

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-diagnostic
          path: |
            tests/e2e/.tmp/playwright-report
            tests/e2e/.tmp/playwright-results
            ${{ runner.temp }}/docomator-browser-api.log
            ${{ runner.temp }}/docomator-browser-worker.log
          if-no-files-found: warn
          retention-days: 3

  offline-bundle:
    name: Assemble, verify and package offline archive
    needs: [verify, browser-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assemble generic offline archive
        shell: bash
        run: |
          set -Eeuo pipefail
          NODE_RUNTIME_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          scripts/offline/prepare-bundle.sh \
            --target-profile generic \
            --node-runtime-dir "$NODE_RUNTIME_ROOT" \
            --without-llm \
            --without-preview \
            --without-ux-acceptance \
            --skip-tests \
            --force

      - name: Verify archive after extraction
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(cat VERSION)"
          case "$(dpkg --print-architecture)" in
            amd64) NODE_ARCH=x64 ;;
            arm64) NODE_ARCH=arm64 ;;
            *) exit 1 ;;
          esac
          ARCHIVE="offline-bundles/docomator-${VERSION}-linux-${NODE_ARCH}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"
          (cd "$(dirname "$ARCHIVE")" && sha256sum --check --strict --quiet "$(basename "$CHECKSUM")")
          EXTRACTED="$RUNNER_TEMP/docomator-offline-extracted"
          mkdir -p "$EXTRACTED"
          while IFS= read -r member; do
            [[ -n "$member" && "$member" != /* ]] || exit 1
            case "/$member/" in */../*) exit 1 ;; esac
          done < <(tar -tzf "$ARCHIVE")
          tar -xzf "$ARCHIVE" -C "$EXTRACTED"
          BUNDLE="$EXTRACTED/docomator-${VERSION}-linux-${NODE_ARCH}"
          "$BUNDLE/verify-bundle.sh" "$BUNDLE"

      - name: Build and verify Project Control update
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          case "$(dpkg --print-architecture)" in
            amd64) NODE_ARCH=x64 ;;
            arm64) NODE_ARCH=arm64 ;;
            *) exit 1 ;;
          esac
          ARCHIVE="offline-bundles/docomator-${VERSION}-linux-${NODE_ARCH}.tar.gz"
          python3 scripts/project-control/package-release.py \
            --archive "$ARCHIVE" \
            --output offline-bundles \
            --project-id docomator \
            --display-name "Оформлятор" \
            --adapter docomator-v1 \
            --version "$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --native-format docomator-offline-v2
          PACKAGE="offline-bundles/docomator-${VERSION}-project-control.f2re.zip"
          [[ -f "$PACKAGE" && -f "$PACKAGE.sha256" ]]
          (cd offline-bundles && sha256sum -c --strict "$(basename "$PACKAGE.sha256")")
          python3 - "$PACKAGE" "$ARCHIVE" "$VERSION" "$SOURCE_SHA" <<'PY'
          import hashlib, json, sys, tarfile, zipfile
          from pathlib import Path

          package, native = map(Path, sys.argv[1:3])
          version, source_sha = sys.argv[3:5]

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with zipfile.ZipFile(package) as archive:
              manifest = json.loads(archive.read("f2re-service.json"))
              payload = manifest["payload"]["path"]
              assert set(archive.namelist()) == {"f2re-service.json", payload}
              assert manifest["schema"] == "f2re-managed-service/v1"
              assert manifest["controllerApi"] == 1
              assert manifest["projectId"] == "docomator"
              assert manifest["adapter"] == "docomator-v1"
              assert manifest["nativeBundleFormat"] == "docomator-offline-v2"
              assert manifest["version"] == version
              assert manifest["sourceCommit"] == source_sha
              digest = hashlib.sha256()
              size = 0
              with archive.open(payload) as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              assert digest.hexdigest() == manifest["payload"]["sha256"] == sha256(native)
              assert size == manifest["payload"]["size"] == native.stat().st_size

          with tarfile.open(native, "r:gz") as archive:
              names = {member.name.rstrip("/") for member in archive if member.name}
          roots = {name.split("/", 1)[0] for name in names}
          assert len(roots) == 1
          root = next(iter(roots))
          for required in ("VERSION", "verify-bundle.sh", "update.sh", "install.sh"):
              assert f"{root}/{required}" in names, required
          PY

      - name: Publish Project Control update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docomator-project-control-${{ github.sha }}
          path: |
            offline-bundles/*-project-control.f2re.zip
            offline-bundles/*-project-control.f2re.zip.sha256
          if-no-files-found: error
          retention-days: 30
