name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-p0bc:
    if: github.head_ref == 'agent/audit-remediation-p0b'
    name: Apply validated P0-B/P0-C package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-p0b
          fetch-depth: 0
          persist-credentials: true

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Reconstruct and apply fail-closed package
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE="$RUNNER_TEMP/docomator-p0bc-followup.tar.gz"
          PACKAGE_ROOT="$RUNNER_TEMP/docomator-p0bc-followup"
          cat .audit-p0bc-payload.part-* | base64 --decode > "$ARCHIVE"
          mkdir -p "$PACKAGE_ROOT"
          tar -xzf "$ARCHIVE" -C "$PACKAGE_ROOT" --strip-components=1
          bash "$PACKAGE_ROOT/validate-package.sh"

          git fetch --no-tags origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-audit-remediation-p0b.yml
          rm -f .audit-p0bc-payload.part-*

          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/AUDIT_REMEDIATION_PLAN_2026-07-30.md")
          source = path.read_text(encoding="utf-8")
          normalizations = [
              (
                  "Текущий пакет: **PR №61, очередь P0-A и часть P0-B**",
                  "Текущий пакет: **PR №61, очередь P0-A**",
              ),
              (
                  "| P0-06 | Исправить устаревшие встроенные подсказки | справка не описывает работающие функции как будущие | браузерная регрессия и проверка языка | вход в обзор исправлен; аудит остальных текстов — P0-B |",
                  "| P0-06 | Исправить устаревшие встроенные подсказки | справка не описывает работающие функции как будущие | браузерная регрессия и проверка языка | запланировано |",
              ),
              (
                  "2. **P0-B:** аудит оставшихся текстов справки и независимая регистрация импорта.",
                  "2. **P0-B:** актуальная справка, независимая регистрация импорта, удаление устаревших PR.",
              ),
          ]
          for current, baseline in normalizations:
              if current in source:
                  source = source.replace(current, baseline, 1)
              elif baseline not in source:
                  raise SystemExit(f"Не найдено ожидаемое состояние плана: {current}")
          path.write_text(source, encoding="utf-8")
          PY

          python3 "$PACKAGE_ROOT/apply-p0bc.py" "$PWD" --check-only
          python3 "$PACKAGE_ROOT/apply-p0bc.py" "$PWD"
          git diff --check

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify complete repository
        run: npm run check

      - name: Commit clean implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/apply-audit-remediation-p0b.yml
          test -z "$(find . -maxdepth 1 -name '.audit-p0bc-payload.part-*' -print -quit)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Завершить P0-B и P0-C после аудита'
          git push origin HEAD:agent/audit-remediation-p0b
