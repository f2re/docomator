name: Применить пакет P0-B после аудита

on:
  push:
    branches:
      - agent/audit-remediation-p0b
    paths:
      - .github/workflows/apply-audit-remediation-p0b.yml

permissions:
  contents: write

concurrency:
  group: apply-audit-remediation-p0b
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-p0b
          fetch-depth: 0

      - name: Применить архитектурные и пользовательские исправления
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{relative}: ожидался один фрагмент, найдено {count}: {old[:120]!r}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          def write(relative: str, content: str) -> None:
              path = ROOT / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          write(
