import fs from "node:fs/promises";
import path from "node:path";
import { fileURLToPath } from "node:url";

const repositoryRoot = path.resolve(import.meta.dirname, "../..");

export const obsoleteCapabilityClaims = [
  {
    pattern: /общий документ пока не скачивается/iu,
    explanation: "сводные DOCX/XLSX уже формируются"
  },
  {
    pattern: /Запись списка в DOCX\\/XLSX появится/iu,
    explanation: "повторяемые строки DOCX/XLSX уже реализованы"
  },
  {
    pattern: /Сохранение версии шаблона появится/iu,
    explanation: "сохранение и активация шаблона уже реализованы"
  },
  {
    pattern: /Текущий этап только проверяет структуру в памяти/iu,
    explanation: "исходник можно сохранить после проверки"
  },
  {
    pattern: /вычисленную выборку/iu,
    explanation: "вычисляемые аудитории ещё не входят в поддерживаемый контракт"
  }
];

export function inspectCapabilityCopy(relativePath, source) {
  const findings = [];
  for (const claim of obsoleteCapabilityClaims) {
    const match = claim.pattern.exec(source);
    if (match === null) continue;
    const line = source.slice(0, match.index).split("\\n").length;
    findings.push(
      `${relativePath}:${line}: «${match[0]}» — ${claim.explanation}`
    );
  }
  return findings;
}

export async function checkUserFacingCapabilities(rootDirectory = repositoryRoot) {
  const uiDirectory = path.join(rootDirectory, "apps", "api", "ui");
  const entries = await fs.readdir(uiDirectory, { withFileTypes: true });
  const findings = [];
  for (const entry of entries.sort((left, right) => left.name.localeCompare(right.name))) {
    if (!entry.isFile() || !/\\.(?:html|js)$/u.test(entry.name)) continue;
    const relativePath = path.posix.join("apps/api/ui", entry.name);
    const source = await fs.readFile(path.join(uiDirectory, entry.name), "utf8");
    findings.push(...inspectCapabilityCopy(relativePath, source));
  }
  if (findings.length > 0) {
    throw new Error(
      `Найдены устаревшие или преждевременные заявления о возможностях:\\n- ${findings.join("\\n- ")}`
    );
  }
}

const invokedPath = process.argv[1] === undefined ? "" : path.resolve(process.argv[1]);
if (invokedPath === fileURLToPath(import.meta.url)) {
  checkUserFacingCapabilities().then(
    () => process.stdout.write("Пользовательские описания соответствуют реализованным возможностям.\\n"),
    (error) => {
      process.stderr.write(`${error instanceof Error ? error.message : String(error)}\\n`);
      process.exitCode = 1;
    }
  );
}
''',
