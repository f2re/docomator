export const BINARY_UPLOAD_CONTENT_TYPES = [
  "application/octet-stream",
  "application/zip",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "text/csv",
  "application/csv"
] as const;

export function registerBinaryContentTypeParser(app: FastifyInstance): void {
  for (const contentType of BINARY_UPLOAD_CONTENT_TYPES) {
    if (app.hasContentTypeParser(contentType)) continue;
    app.addContentTypeParser(
      contentType,
      { parseAs: "buffer" },
      (_request, body, done) => {
        done(null, body);
      }
    );
  }
}
''',
