name: Применить исправление повторяемой строки DOCX

on:
  push:
    branches:
      - fix/docx-repeat-row-flow
    paths:
      - .github/workflows/apply-docx-repeat-row-fix.yml
      - scripts/ci/apply-docx-repeat-row-fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: fix/docx-repeat-row-flow
          fetch-depth: 0
          show-progress: false

      - name: Применить исправление
        run: python3 scripts/ci/apply-docx-repeat-row-fix.py

      - name: Проверить синтаксис интерфейсного расширения
        run: node --check apps/api/ui/template-row-flow.js

      - name: Зафиксировать итоговое изменение
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-docx-repeat-row-fix.py \
            .github/workflows/apply-docx-repeat-row-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Исправить повторяемую строку обычного документа Word'
          git push origin HEAD:fix/docx-repeat-row-flow
