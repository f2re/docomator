name: Apply Oformlyator brand system v2

on:
  push:
    branches:
      - design/oformlyator-brand-system

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "chore: apply brand system [brand-system-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply brand system
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/apply-brand-system.py')
          text = path.read_text(encoding='utf-8')
          old = "replace_once(index, '          <span aria-hidden=\"true\">❓</span>', '          <span aria-hidden=\"true\">?</span>')"
          new = "replace_once(index, '<button class=\"quiet-button\" id=\"helpButton\" type=\"button\"><span aria-hidden=\"true\">❓</span><span>Помощь</span></button>', '<button class=\"quiet-button\" id=\"helpButton\" type=\"button\"><span aria-hidden=\"true\">?</span><span>Помощь</span></button>')"
          if text.count(old) != 1:
              raise SystemExit('temporary transformer patch marker not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/ci/apply-brand-system.py
          node --check scripts/ci/check-branding.mjs
          node scripts/ci/check-branding.mjs
          git diff --check
      - name: Commit transformed tree
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: apply brand system [brand-system-applied]"
          git push origin HEAD:design/oformlyator-brand-system
