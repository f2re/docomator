name: Apply Oformlyator brand system v2

on:
  push:
    branches:
      - design/oformlyator-brand-system

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "chore: apply brand system [brand-system-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply brand system
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/apply-brand-system.py')
          text = path.read_text(encoding='utf-8')
          patches = [
              (
                  "replace_once(index, '          <span aria-hidden=\"true\">❓</span>', '          <span aria-hidden=\"true\">?</span>')",
                  "replace_once(index, '<button class=\"quiet-button\" id=\"helpButton\" type=\"button\"><span aria-hidden=\"true\">❓</span><span>Помощь</span></button>', '<button class=\"quiet-button\" id=\"helpButton\" type=\"button\"><span aria-hidden=\"true\">?</span><span>Помощь</span></button>')",
              ),
              (
                  "'          <div class=\"hero-visual\" aria-hidden=\"true\"><div class=\"live-sheet\"><span></span><span></span><span></span><span></span><span></span></div></div>\\n'",
                  "'            <div class=\"hero-visual\" aria-hidden=\"true\"><div class=\"live-sheet\"><i></i><i></i><i></i><b></b></div></div>\\n'",
              ),
          ]
          for old, new in patches:
              if text.count(old) != 1:
                  raise SystemExit(f'temporary transformer patch marker not found exactly once: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/ci/apply-brand-system.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/check-branding.mjs')
          text = path.read_text(encoding='utf-8')
          block = '''    if (/^\\s*:root(?:\\[|\\s*\\{)/mu.test(text ?? "")) {\n      findings.push(`${relativePath}: найден конкурирующий корневой theme-блок`);\n    }\n'''
          if text.count(block) != 1:
              raise SystemExit('branding checker root-selector block not found exactly once')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
          node --check scripts/ci/check-branding.mjs
          node scripts/ci/check-branding.mjs
          git diff --check
      - name: Commit transformed tree
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: apply brand system [brand-system-applied]"
          git push origin HEAD:design/oformlyator-brand-system
