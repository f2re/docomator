name: Подключить администрирование БД и импорт

on:
  push:
    branches:
      - feature/import-normalization-db-admin
    paths:
      - scripts/ci/apply-database-admin-integration.py
      - scripts/ci/fix-db-admin-count-casts.py
      - scripts/ci/fix-bulk-v3-template.py
      - scripts/ci/fix-db-admin-limits.py
      - .github/workflows/apply-database-admin-integration.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/ci/apply-database-admin-integration.py
      - scripts/ci/fix-db-admin-count-casts.py
      - scripts/ci/fix-bulk-v3-template.py
      - scripts/ci/fix-db-admin-limits.py
      - .github/workflows/apply-database-admin-integration.yml

permissions:
  contents: write

concurrency:
  group: apply-database-admin-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/import-normalization-db-admin
          fetch-depth: 0
      - name: Применить интеграцию
        run: |
          python3 scripts/ci/apply-database-admin-integration.py
          python3 scripts/ci/fix-db-admin-count-casts.py
          python3 scripts/ci/fix-bulk-v3-template.py
          python3 scripts/ci/fix-db-admin-limits.py
      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить сборку и синтаксис
        run: |
          npm run build
          npm run check:ui
          npm run check:runtime
          npm run check:language
      - name: Зафиксировать интеграцию
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-database-admin-integration.py \
            scripts/ci/fix-db-admin-count-casts.py \
            scripts/ci/fix-bulk-v3-template.py \
            scripts/ci/fix-db-admin-limits.py \
            .github/workflows/apply-database-admin-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Добавить безопасное администрирование БД и опции импорта'
          git push origin HEAD:feature/import-normalization-db-admin
