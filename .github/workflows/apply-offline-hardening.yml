name: Усилить автономный комплект

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/ci/apply-offline-hardening.py
      - scripts/ci/fix-offline-hardening-script.py
      - .github/workflows/apply-offline-hardening.yml
      - scripts/offline/collect-os-packages.sh
      - scripts/offline/verify-target-profile.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-offline-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-entities-offline-audit
          fetch-depth: 0
      - name: Исправить сценарий применения
        run: python3 scripts/ci/fix-offline-hardening-script.py
      - name: Применить исправления
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/apply-offline-hardening.py 2>&1 | tee offline-hardening-apply.log
      - name: Установить зависимости
        if: steps.apply.outcome == 'success'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить shell и JavaScript
        if: steps.apply.outcome == 'success'
        run: |
          bash -n scripts/offline/collect-os-packages.sh
          bash -n scripts/offline/lib.sh
          bash -n scripts/offline/prepare-bundle.sh
          bash -n scripts/offline/build-full-bundle.sh
          bash -n scripts/offline/verify-bundle.sh
          node --check scripts/offline/verify-target-profile.mjs
      - name: Проверить репозиторий
        if: steps.apply.outcome == 'success'
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee offline-hardening-check.log
      - name: Сохранить диагностику
        if: steps.apply.outcome == 'failure' || steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: offline-hardening-diagnostic
          path: |
            offline-hardening-apply.log
            offline-hardening-check.log
          if-no-files-found: warn
          retention-days: 3
      - name: Остановиться после ошибки
        if: steps.apply.outcome == 'failure' || steps.check.outcome == 'failure'
        run: exit 1
      - name: Зафиксировать исправления
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-offline-hardening.py \
            scripts/ci/fix-offline-hardening-script.py \
            .github/workflows/apply-offline-hardening.yml \
            offline-hardening-apply.log \
            offline-hardening-check.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Гарантировать профиль и полноту автономного комплекта'
          git push origin HEAD:feature/generic-entities-offline-audit
