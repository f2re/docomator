name: Repair versioning lockfile

on:
  push:
    branches:
      - release/versioning-0.2.0

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'f2re'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Repair exactly one accidental lockfile line
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const text = fs.readFileSync(path, 'utf8');
          const bad = '"node_modules/fast-deep-equal": {\n      "version": "1.3.3",\n      "resolved": "https://registry.npmjs.org/fast-deep-equal/-/fast-deep-equal-3.1.3.tgz"';
          const good = '"node_modules/fast-deep-equal": {\n      "version": "3.1.3",\n      "resolved": "https://registry.npmjs.org/fast-deep-equal/-/fast-deep-equal-3.1.3.tgz"';
          const count = text.split(bad).length - 1;
          if (count === 0 && text.includes(good)) process.exit(0);
          if (count !== 1) throw new Error(`expected exactly one known bad lock block, found ${count}`);
          fs.writeFileSync(path, text.replace(bad, good));
          NODE
          git diff --check
          test "$(git diff --numstat -- package-lock.json | awk '{print $1 ":" $2}')" = "1:1"
          git diff -- package-lock.json | grep -F -- '-      "version": "1.3.3"'
          git diff -- package-lock.json | grep -F -- '+      "version": "3.1.3"'
      - name: Commit repair when needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(release): restore third-party lock metadata'
          git push origin HEAD:release/versioning-0.2.0
