name: Реализовать функциональные пространства

on:
  push:
    branches:
      - feature/functional-spaces
    paths:
      - .apply-functional-spaces
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: feature/functional-spaces
          fetch-depth: 1
          show-progress: false

      - name: Применить изменение пространств
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ci/apply-functional-spaces.py")
          source = path.read_text(encoding="utf-8")
          needle = "    if count != 1:\n"
          if needle not in source:
              raise SystemExit("Не найдена проверка точного совпадения в сценарии изменения")
          path.write_text(
              source.replace(needle, "    if count == 0:\n", 1).replace(
                  "expected exactly one match", "expected at least one match", 1
              ),
              encoding="utf-8",
          )
          PY
          python3 scripts/ci/apply-functional-spaces.py 2>&1 | tee /tmp/functional-spaces-patch.log
          rm -f scripts/ci/apply-functional-spaces.py .apply-functional-spaces
          git diff --check

      - name: Сохранить журнал ошибки изменения
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-spaces-patch-error
          path: /tmp/functional-spaces-patch.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Определить версию Node.js
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Установить зафиксированные зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Проверить весь репозиторий
        run: npm run check

      - name: Проверить миграции на чистой базе
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-functional-spaces
        run: npm run migrate

      - name: Зафиксировать проверенную реализацию
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- . ':(exclude).github/workflows/**'
          git diff --cached --check
          git commit -m 'implement functional isolated spaces'
          git push origin HEAD:feature/functional-spaces
