name: Publish verified release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCOMATOR_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCOMATOR_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/ci/publish-github-release.mjs
