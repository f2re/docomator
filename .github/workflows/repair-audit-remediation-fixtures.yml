name: Исправить фабрику автономного комплекта

on:
  push:
    branches:
      - agent/audit-remediation-p0
    paths:
      - .github/workflows/repair-audit-remediation-fixtures.yml

permissions:
  contents: write

concurrency:
  group: repair-audit-remediation-fixtures
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: agent/audit-remediation-p0
          fetch-depth: 0

      - name: Добавить обязательные файлы в тестовый комплект
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/offline/verify-bundle.test.mjs")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '    "payload/app/scripts/runtime/automatic-backup.mjs",\n',
                  '    "payload/app/scripts/runtime/database-admin.mjs",\n'
                  '    "payload/app/scripts/runtime/automatic-backup.mjs",\n',
              ),
              (
                  '    "payload/app/apps/api/ui/generic-document-generation.js",\n',
                  '    "payload/app/apps/api/ui/generic-document-generation.js",\n'
                  '    "payload/app/apps/api/ui/database-admin.js",\n'
                  '    "payload/app/apps/api/ui/bulk-data-import-v3.js",\n',
              ),
          ]
          for old, new in replacements:
              if new in source:
                  continue
              if source.count(old) != 1:
                  raise SystemExit(f"Ожидался один точный фрагмент: {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
          rm -f .github/workflows/repair-audit-remediation-fixtures.yml
          git diff --check

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Установить зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Проверить исправленные фабрики
        run: node --test scripts/offline/verify-bundle.test.mjs scripts/offline/pilot-runtime-bundle.test.mjs

      - name: Зафиксировать чистую проверенную ветку
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Исправить тестовые автономные комплекты после добавления администратора БД'
          git push origin HEAD:agent/audit-remediation-p0
