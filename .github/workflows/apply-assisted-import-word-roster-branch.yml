name: Применить интеграцию расширенного импорта в ветке

on:
  push:
    branches:
      - feature/assisted-import-word-roster
    paths:
      - .github/workflows/apply-assisted-import-word-roster-branch.yml
      - scripts/ci/run-assisted-import-word-roster.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/assisted-import-word-roster
          fetch-depth: 0
          show-progress: false
      - name: Применить изменения
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/run-assisted-import-word-roster.py
          rm -f \
            scripts/ci/apply-assisted-import-word-roster.py \
            scripts/ci/run-assisted-import-word-roster.py \
            .assisted-import.error.log \
            .github/workflows/apply-assisted-import-word-roster-branch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat assisted people import and Word roster tables'
          git push origin HEAD:feature/assisted-import-word-roster
