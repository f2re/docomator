name: Завершить встроенную документацию

on:
  push:
    branches:
      - feature/complete-web-documentation
    paths:
      - .github/workflows/apply-complete-web-documentation.yml
      - scripts/ci/apply-complete-web-documentation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-web-documentation
          fetch-depth: 0
          show-progress: false
      - name: Применить интеграционные изменения
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/apply-complete-web-documentation.py
          rm -f \
            scripts/ci/apply-complete-web-documentation.py \
            .github/workflows/apply-complete-web-documentation.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'docs complete local web documentation center'
          git push origin HEAD:feature/complete-web-documentation
