name: Типизировать группы произвольных объектов

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/ci/finalize-group-types.py
      - .github/workflows/finalize-group-types.yml

permissions:
  contents: write

concurrency:
  group: finalize-group-types
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-entities-offline-audit
          fetch-depth: 0
      - name: Применить изменения
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/finalize-group-types.py 2>&1 | tee finalize-group-types-apply.log
      - name: Установить зависимости
        if: steps.apply.outcome == 'success'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить репозиторий
        if: steps.apply.outcome == 'success'
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee finalize-group-types-check.log
      - name: Сохранить диагностику
        if: steps.apply.outcome == 'failure' || steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: finalize-group-types-diagnostic
          path: |
            finalize-group-types-apply.log
            finalize-group-types-check.log
          if-no-files-found: warn
          retention-days: 3
      - name: Остановиться после ошибки
        if: steps.apply.outcome == 'failure' || steps.check.outcome == 'failure'
        run: exit 1
      - name: Зафиксировать изменения
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/finalize-group-types.py \
            .github/workflows/finalize-group-types.yml \
            finalize-group-types-apply.log \
            finalize-group-types-check.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Типизировать группы произвольных объектов'
          git push origin HEAD:feature/generic-entities-offline-audit
