name: One-shot version sync 0.6.2

on:
  push:
    branches:
      - fix/data-import-flexible-test-headers
    paths:
      - .github/workflows/.tmp-version-bump-062.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/data-import-flexible-test-headers
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Synchronize release identity
        run: node scripts/release/bump-version.mjs patch
      - name: Commit generated version files and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/.tmp-version-bump-062.yml
          git add RELEASE_IDENTITY.json VERSION package.json package-lock.json apps/api/package.json apps/worker/package.json packages/config/package.json packages/contracts/package.json packages/document-intake/package.json packages/storage/package.json packages/template-compiler/package.json packages/config/src/index.ts config/docomator.env.example docs/RELEASE_NOTES.md SECURITY.md docs/SUPPORT_MATRIX.md docs/FINALIZATION.md docs/ROADMAP.md docs/NEXT_ITERATIONS.md
          git commit -m "chore(release): bump Оформлятор to 0.6.2"
          git push origin HEAD:fix/data-import-flexible-test-headers
