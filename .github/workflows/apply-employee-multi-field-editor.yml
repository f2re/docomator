name: Применить автоматизацию карточек и расписаний

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/operator-automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: feature/operator-automation
          fetch-depth: 0
          show-progress: false

      - name: Определить необходимость применения
        id: detect
        shell: bash
        run: |
          if [[ -f scripts/ci/apply-operator-automation.py ]]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Изменения уже применены.'
          fi

      - name: Применить изменения
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python3 scripts/ci/apply-operator-automation.py > /tmp/operator-automation.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            cp /tmp/operator-automation.log .operator-automation.error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .operator-automation.error.log
            git commit --no-verify -m 'capture operator automation diagnostics' || true
            git push origin HEAD:feature/operator-automation || true
            cat /tmp/operator-automation.log
            exit "$status"
          fi
          cat /tmp/operator-automation.log
          git diff --check

      - name: Определить версию Node.js
        if: steps.detect.outputs.apply == 'true'
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        if: steps.detect.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Установить зависимости
        if: steps.detect.outputs.apply == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Проверить репозиторий
        if: steps.detect.outputs.apply == 'true'
        run: npm run check

      - name: Проверить миграции
        if: steps.detect.outputs.apply == 'true'
        env:
          DOCOMATOR_DATA_DIR: ${{ runner.temp }}/docomator-operator-automation
        run: npm run migrate

      - name: Зафиксировать проверенные изменения
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-operator-automation.py \
            .operator-automation.error.log \
            .github/workflows/apply-employee-multi-field-editor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat automate employee fields groups and schedules'
          git push origin HEAD:feature/operator-automation
