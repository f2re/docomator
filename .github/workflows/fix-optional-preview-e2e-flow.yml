name: Исправить финальный шаг шаблона

on:
  push:
    branches:
      - fix/template-structure-preview-csp
    paths:
      - .github/workflows/fix-optional-preview-e2e-flow.yml
      - scripts/ci/fix-optional-preview-e2e-flow.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/template-structure-preview-csp
          fetch-depth: 0
          show-progress: false
      - run: python3 scripts/ci/fix-optional-preview-e2e-flow.py
      - shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/fix-optional-preview-e2e-flow.py \
            .github/workflows/fix-optional-preview-e2e-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Исправить финальный шаг сохранения шаблона'
          git push origin HEAD:fix/template-structure-preview-csp
