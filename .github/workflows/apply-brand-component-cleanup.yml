name: Apply brand component cleanup

on:
  push:
    branches:
      - design/oformlyator-brand-system

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "chore: tighten brand component rules [brand-cleanup-applied]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tighten component rules
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement count {text.count(old)} for {old[:90]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          styles = Path('apps/api/ui/styles.css')
          replace_once(
              styles,
              '.sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; display: flex; width: var(--sidebar); flex-direction: column; padding: 20px 15px; background: var(--glass); border-right: 1px solid var(--border); backdrop-filter: blur(24px) saturate(150%); }',
              '.sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; display: flex; width: var(--sidebar); flex-direction: column; padding: 20px 15px; background: var(--glass); border-right: 1px solid var(--border); }',
          )
          replace_once(
              styles,
              '.topbar { position: sticky; z-index: 20; top: 0; display: flex; min-height: 102px; align-items: center; justify-content: space-between; gap: 18px; padding: 17px 0 14px; background: linear-gradient(to bottom, var(--background) 72%, transparent); }',
              '.topbar { position: sticky; z-index: 20; top: 0; display: flex; min-height: 102px; align-items: center; justify-content: space-between; gap: 18px; padding: 17px 0 14px; background: var(--background); }',
          )
          replace_once(
              styles,
              '.primary-button { color: white; background: var(--accent-fill); box-shadow: 0 8px 22px rgba(57, 121, 246, .22); }',
              '.primary-button { color: white; background: var(--accent-fill); }',
          )
          visual_block = '''.hero-visual { display: grid; place-items: center; background: linear-gradient(145deg, var(--accent-soft), transparent); }\n.document-stack { display: flex; gap: 10px; transform: rotate(-5deg); }\n.document-stack span { display: grid; width: 64px; height: 82px; place-items: center; font-size: 1.7rem; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-large); }\n.live-sheet { position: relative; width: 154px; height: 200px; padding: 54px 25px 22px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px; box-shadow: 0 20px 50px rgba(28, 38, 58, .14); transform: rotate(2deg); }\n.live-sheet::before { position: absolute; top: 22px; left: 25px; width: 58px; height: 9px; content: ""; background: var(--text); border-radius: 2px; opacity: .86; }\n.live-sheet i { display: block; height: 5px; margin-bottom: 16px; background: var(--border-strong); border-radius: 999px; }\n.live-sheet i:nth-child(2) { width: 78%; }\n.live-sheet i:nth-child(3) { width: 88%; }\n.live-sheet b { position: absolute; right: 22px; bottom: 23px; width: 34px; height: 34px; border: 2px solid var(--accent); border-radius: 50%; opacity: .72; }\n'''
          replace_once(styles, visual_block, '')

          stability = Path('apps/api/ui/interface-stability.css')
          replace_once(stability, '  min-height: 42px;\n  grid-template-columns: 22px minmax(0, 1fr) auto;', '  min-height: var(--touch-target);\n  grid-template-columns: 22px minmax(0, 1fr) auto;')
          replace_once(stability, '.quiet-button {\n  min-height: 40px;\n  border-radius: var(--radius-control);\n}', '.quiet-button {\n  min-height: var(--touch-target);\n  border-radius: var(--radius-control);\n}\n\n.quiet-button.compact,\n.text-button,\n.segmented-control button {\n  min-height: var(--touch-target);\n}')
          replace_once(stability, '  min-height: 38px;\n  padding: 0 11px;', '  min-height: var(--touch-target);\n  padding: 0 11px;')
          replace_once(stability, '  width: 40px;\n  height: 40px;', '  width: var(--touch-target);\n  height: var(--touch-target);')
          replace_once(stability, '  min-height: 42px;\n  padding: 0 15px;', '  min-height: var(--touch-target);\n  padding: 0 15px;')

          checker = Path('scripts/ci/check-branding.mjs')
          text = checker.read_text(encoding='utf-8')
          marker = '''  for (const relativePath of [\n    "apps/api/ui/styles.css",\n    "apps/api/ui/interface-hierarchy.css",\n    "apps/api/ui/interface-stability.css"\n  ]) {\n    const text = await inspectText(relativePath);\n    if (text?.includes("--accent:")) {\n      findings.push(`${relativePath}: палитра должна жить только в brand-tokens.css`);\n    }\n  }\n'''
          replacement = marker + '''\n  const baseStylesPath = "apps/api/ui/styles.css";\n  const baseStyles = await inspectText(baseStylesPath);\n  for (const forbidden of [\n    "backdrop-filter: blur",\n    "rgba(57, 121, 246",\n    ".hero-visual",\n    ".live-sheet",\n    "linear-gradient(to bottom, var(--background)"\n  ]) {\n    if (baseStyles?.includes(forbidden)) findings.push(`${baseStylesPath}: найден устаревший эффект ${forbidden}`);\n  }\n\n  const stabilityPath = "apps/api/ui/interface-stability.css";\n  const stability = await inspectText(stabilityPath);\n  for (const fragment of [\n    "min-height: var(--touch-target);",\n    "width: var(--touch-target);",\n    "height: var(--touch-target);"\n  ]) {\n    requireFragment(findings, stability, stabilityPath, fragment);\n  }\n'''
          if text.count(marker) != 1:
              raise SystemExit('branding checker component marker not found exactly once')
          checker.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          node --check scripts/ci/check-branding.mjs
          node scripts/ci/check-branding.mjs
          git diff --check
      - name: Commit cleanup
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/ui/styles.css apps/api/ui/interface-stability.css scripts/ci/check-branding.mjs
          git diff --cached --check
          git commit -m "chore: tighten brand component rules [brand-cleanup-applied]"
          git push origin HEAD:design/oformlyator-brand-system
