name: Усилить контраст вторичного текста

on:
  push:
    branches:
      - feature/interface-hierarchy
    paths:
      - .github/workflows/fix-interface-contrast.yml
      - scripts/ci/fix-interface-contrast.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interface-hierarchy
          fetch-depth: 0
          show-progress: false
      - run: python3 scripts/ci/fix-interface-contrast.py
      - shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/ci/fix-interface-contrast.py .github/workflows/fix-interface-contrast.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Усилить контраст вторичного текста'
          git push origin HEAD:feature/interface-hierarchy
