name: Подключить интерфейс произвольных сущностей

on:
  push:
    branches:
      - feature/generic-entities-offline-audit
    paths:
      - .github/workflows/apply-generic-entities-ui.yml
      - scripts/ci/apply-generic-entities-ui.py
      - scripts/ci/entity-workspace.part1
      - scripts/ci/entity-workspace.part2
      - scripts/ci/entity-workspace.part3
      - scripts/ci/entity-workspace.part4
      - apps/api/ui/entity-workspace.css
      - apps/api/ui/generic-template-entities.js
      - apps/api/ui/generic-document-generation.js
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-generic-entities-ui.yml
      - scripts/ci/apply-generic-entities-ui.py
      - scripts/ci/entity-workspace.part1
      - scripts/ci/entity-workspace.part2
      - scripts/ci/entity-workspace.part3
      - scripts/ci/entity-workspace.part4
      - apps/api/ui/entity-workspace.css
      - apps/api/ui/generic-template-entities.js
      - apps/api/ui/generic-document-generation.js

permissions:
  contents: write

concurrency:
  group: apply-generic-entities-ui
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-entities-offline-audit
          fetch-depth: 0
      - name: Собрать и подключить интерфейс
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/apply-generic-entities-ui.py 2>&1 | tee generic-entities-ui-apply.log
      - name: Проверить синтаксис интерфейса
        if: steps.apply.outcome == 'success'
        run: |
          node --check apps/api/ui/entity-workspace.js
          node --check apps/api/ui/generic-template-entities.js
          node --check apps/api/ui/generic-document-generation.js
          node --check apps/api/ui/template-row-editor-v2.js
      - name: Установить зависимости
        if: steps.apply.outcome == 'success'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить репозиторий
        if: steps.apply.outcome == 'success'
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee generic-entities-ui-check.log
      - name: Сохранить диагностику
        if: steps.apply.outcome == 'failure' || steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generic-entities-ui-diagnostic
          path: |
            generic-entities-ui-apply.log
            generic-entities-ui-check.log
          if-no-files-found: warn
          retention-days: 3
      - name: Остановиться после ошибки
        if: steps.apply.outcome == 'failure' || steps.check.outcome == 'failure'
        run: exit 1
      - name: Зафиксировать интерфейс
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-generic-entities-ui.py \
            scripts/ci/entity-workspace.part1 \
            scripts/ci/entity-workspace.part2 \
            scripts/ci/entity-workspace.part3 \
            scripts/ci/entity-workspace.part4 \
            .github/workflows/apply-generic-entities-ui.yml \
            generic-entities-ui-apply.log \
            generic-entities-ui-check.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Добавить каталог и импорт произвольных объектов'
          git push origin HEAD:feature/generic-entities-offline-audit
