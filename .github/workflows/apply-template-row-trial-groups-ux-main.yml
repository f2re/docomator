name: Применить исправления строк и групп

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-template-row-trial-groups-ux-main.yml
  issue_comment:
    types:
      - created

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/apply-template-row-trial-groups-ux')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: fix/template-row-trial-groups-ux
          fetch-depth: 0
          show-progress: false

      - name: Исправить ожидания проверок
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/fix-template-row-trial-groups-checks.py
          git diff --check
          node --check tests/e2e/fixtures/docomator-api.mjs
          node --check tests/e2e/word-roster-assistant.spec.mjs
          node --check tests/e2e/template-multi-trial-recovery.spec.mjs
          node --check tests/e2e/group-management-large.spec.mjs

      - name: Зафиксировать итог в рабочей ветке
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/ci/fix-template-row-trial-groups-checks.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix repository checks for template UX'
          git push origin HEAD:fix/template-row-trial-groups-ux
