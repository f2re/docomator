name: Применить исправления строк и групп

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-template-row-trial-groups-ux-main.yml
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/template-row-trial-groups-ux'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: fix/template-row-trial-groups-ux
          fetch-depth: 0
          show-progress: false

      - name: Применить интеграцию
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/apply-template-row-trial-groups-ux.py
          git diff --check
          node --check apps/api/ui/template-row-editor-v2.js
          node --check apps/api/ui/template-placement-guidance.js
          node --check apps/api/ui/template-multi-trial-recovery.js
          node --check apps/api/ui/group-management-v2.js
          node --check tests/e2e/word-roster-assistant.spec.mjs
          node --check tests/e2e/template-multi-trial-recovery.spec.mjs
          node --check tests/e2e/group-management-large.spec.mjs

      - name: Зафиксировать итог в рабочей ветке
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/apply-template-row-trial-groups-ux.py \
            .github/workflows/apply-template-row-trial-groups-ux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix template row trial and group workflows'
          git push origin HEAD:fix/template-row-trial-groups-ux
