name: Завершить интерфейс перед слиянием

on:
  push:
    branches:
      - feature/interface-hierarchy
    paths:
      - .github/workflows/finalize-interface-merge.yml
      - scripts/ci/finalize-interface-merge.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interface-hierarchy
          fetch-depth: 0
          show-progress: false

      - name: Применить финальные исправления
        run: python3 scripts/ci/finalize-interface-merge.py

      - name: Проверить синтаксис изменённых модулей
        run: node --check apps/api/ui/template-row-editor-v2.js

      - name: Зафиксировать итоговую ревизию
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            scripts/ci/finalize-interface-merge.py \
            .github/workflows/finalize-interface-merge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Завершить исправления интерфейса перед слиянием'
          git push origin HEAD:feature/interface-hierarchy
